<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Design + HCI Studio</title>
<style>
:root{--ink:#23352e;--muted:#718078;--paper:#f7f3ea;--panel:#fffdf8;--line:#ded8ca;--green:#183f34;--gold:#a8874d;--sage:#dce5dc}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,sans-serif}.shell{display:flex;min-height:100vh}.side{width:245px;background:var(--green);color:#fff;padding:30px 20px;position:fixed;inset:0 auto 0 0}.brand{font:25px Georgia,serif}.sub{font-size:12px;color:#c7d4ce}.nav{margin-top:40px;display:grid;gap:6px}.nav button{background:none;border:0;color:#dbe5df;text-align:left;padding:10px 12px;border-radius:8px}.nav button.active,.nav button:hover{background:#285546;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:42px clamp(25px,5vw,75px);max-width:1250px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--gold);font-weight:700}.hero h1,h1,h2,h3{font-family:Georgia,serif;font-weight:400}.hero h1{font-size:44px;line-height:1.08;margin:8px 0 14px}.hero p{max-width:720px;color:var(--muted);font-size:17px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}.stat b{display:block;font:30px Georgia,serif}.stat span,.small{color:var(--muted);font-size:12px}.card{margin:16px 0}.card h2{margin:0 0 10px;font-size:24px}.card h3{margin:0 0 6px;font-size:18px}.pill{display:inline-block;background:var(--sage);padding:4px 9px;border-radius:99px;font-size:12px;margin:3px}.task{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0}.task input{margin-top:5px}.task.done .tasktext{text-decoration:line-through;color:var(--muted)}.q{background:#f1eadb;border-left:3px solid var(--gold);padding:14px 16px;margin:14px 0}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}input,textarea,select{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink)}textarea{min-height:110px;resize:vertical}.btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:8px;padding:9px 14px;cursor:pointer}.btn.secondary{background:transparent;color:var(--green)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.obs{border-top:1px solid var(--line);padding:18px 0}.obs:first-of-type{border-top:0}.obs strong{font:18px Georgia,serif}.weeknav{display:flex;justify-content:space-between;align-items:center;gap:10px}@media(max-width:800px){.side{position:static;width:100%;height:auto}.shell{display:block}.main{margin:0;width:100%;padding:28px 18px}.nav{display:flex;overflow:auto;margin-top:20px}.nav button{white-space:nowrap}.grid{grid-template-columns:1fr}.hero h1{font-size:36px}}
</style></head><body>
<div class="shell"><aside class="side"><div class="brand">HCI Studio</div><div class="sub">Product Design + HCI</div><nav class="nav" id="nav"></nav></aside><main class="main" id="app"></main></div>
<script>
var KEY="pdHciStudio";
var weeks=[["HCI Foundations","How do people actually interact with the world around them, and what can designers learn from observing that interaction?"],["Human Behavior & Limitations","How do attention, memory, perception, and motivation shape interaction?"],["Mental Models","How do expectations form, and where do product models diverge from user models?"],["Design Principles","How do affordances, signifiers, feedback, mapping, and constraints communicate action?"],["HCI Synthesis","What patterns are you now able to see that you previously overlooked?"]];
for(var wi=6;wi<=44;wi++)weeks.push(["Studio Week "+wi,"Continue building HCI, UX research, IA, interaction design, evaluation, and product thinking through applied practice."]);
var state=JSON.parse(localStorage.getItem(KEY)||"null")||{week:1,tasks:{},concepts:[],observations:[],reflection:"",notes:"",evidence:[]};
var page="dashboard";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function go(p){page=p;nav();render()}
function nav(){var items=[["dashboard","Dashboard"],["curriculum","Curriculum"],["library","Learning Library"],["evidence","Work & Evidence"]];document.getElementById("nav").innerHTML=items.map(function(x){return '<button class="'+(page===x[0]?"active":"")+'" onclick="go(\''+x[0]+'\')">'+x[1]+"</button>"}).join("")}
function dashboard(){var done=Object.keys(state.tasks).filter(function(k){return state.tasks[k]}).length;return '<section class="hero"><div class="eyebrow">Personal learning + evidence system</div><h1>Learn. Observe. Apply. Reflect.</h1><p>A studio for building real HCI and Product Design depth—not just checking off a course.</p></section><div class="grid"><div class="stat"><b>Week '+state.week+'</b><span>Current studio week</span></div><div class="stat"><b>'+done+'</b><span>Tasks completed</span></div><div class="stat"><b>'+state.concepts.length+'</b><span>Concepts captured</span></div></div><div class="card"><h2>This week</h2><h3>Week '+state.week+' — '+esc(weeks[state.week-1][0])+'</h3><p>'+esc(weeks[state.week-1][1])+'</p><button class="btn" onclick="go(\'curriculum\')">Open week</button></div><div class="card"><h2>The studio loop</h2><p><span class="pill">Learn</span><span class="pill">Capture</span><span class="pill">Observe</span><span class="pill">Apply</span><span class="pill">Critique</span><span class="pill">Reflect</span><span class="pill">Evidence</span></p></div>'}
function task(id,text){var k=state.week+"-"+id;return '<div class="task '+(state.tasks[k]?"done":"")+'"><input type="checkbox" '+(state.tasks[k]?"checked":"")+' onchange="state.tasks[\''+k+'\']=this.checked;save()"><div class="tasktext">'+text+'</div></div>'}
function observation(i){var o=state.observations[i]||{};function f(k,l,t){return '<div class="field"><label>'+l+'</label>'+ (t?"<textarea data-i=\""+i+"\" data-k=\""+k+"\">"+esc(o[k])+"</textarea>":"<input data-i=\""+i+"\" data-k=\""+k+"\" value=\""+esc(o[k])+"\">")+"</div>"}return '<div class="obs"><strong>'+(i+1)+'. Observation</strong>'+f("goal","What were you trying to do?")+f("expect","What did you expect?")+f("signal","What did the design communicate?")+f("result","What happened?")+f("error","Where did you hesitate or make an error?")+f("human","What does this tell you about the human using it?",true)+'</div>'}
function saveObs(){document.querySelectorAll("[data-i]").forEach(function(el){var i=+el.dataset.i;state.observations[i]=state.observations[i]||{};state.observations[i][el.dataset.k]=el.value});save()}
function curriculum(){var w=state.week;var html='<div class="weeknav"><div><div class="eyebrow">Curriculum · Phase '+(w<=5?1:w<=13?2:w<=19?3:w<=27?4:w<=34?5:6)+'</div><h1>Week '+w+' — '+esc(weeks[w-1][0])+'</h1></div><select onchange="state.week=+this.value;save()">';weeks.forEach(function(x,i){html+='<option value="'+(i+1)+'" '+(i+1===w?"selected":"")+'>Week '+(i+1)+' — '+esc(x[0])+'</option>'});html+='</select></div><div class="card"><div class="eyebrow">Core question</div><h2>'+esc(weeks[w-1][1])+'</h2></div><div class="card"><h2>Studio tasks</h2>';
if(w===1){html+=task("read","<b>1.</b> Read <i>The Design of Everyday Things</i> actively. Identify 3 moments where Norman describes a mismatch between expectation and what a product allows.");html+=task("observe","<b>2.</b> Observe 10 everyday objects or experiences. Do not redesign them yet.");html+=task("capture","<b>3.</b> Capture HCI vocabulary as you encounter it: mental model, affordance, signifier, feedback, mapping, constraint, discoverability, error, recognition vs recall.");html+=task("apply","<b>4.</b> Choose one observation and explain what it reveals about people, technology, and context.");html+=task("reflect","<b>5.</b> Write: What did I notice this week that I would not have noticed before studying HCI?");}
else{html+=task("learn","<b>1.</b> Complete the core learning for this week.");html+=task("apply","<b>2.</b> Apply the idea to a real product or experience.");html+=task("capture","<b>3.</b> Capture 3 observations, examples, or questions.");html+=task("concept","<b>4.</b> Add one useful concept to the Learning Library.");html+=task("reflect","<b>5.</b> Reflect on what changed in your thinking.");}
html+='</div>';
if(w===1){html+='<div class="card"><h2>Read</h2><p><b>The Design of Everyday Things</b> — Don Norman</p><div class="q">Active reading prompt: identify moments where the designer’s model, the user’s mental model, and the product’s actual behavior do not line up.</div></div><div class="card"><h2>Observe 10 everyday interactions</h2><p class="small">Suggested: door, faucet, stove, elevator, microwave, car interface, coffee machine, ATM, phone app, frustrating home object.</p>';for(var i=0;i<10;i++)html+=observation(i);html+='<button class="btn" onclick="saveObs()">Save observations</button></div><div class="card"><h2>Reflection</h2><div class="q">What did I notice this week that I wouldn’t have noticed before studying HCI?</div><textarea id="reflection">'+esc(state.reflection)+'</textarea><button class="btn" onclick="state.reflection=document.getElementById(\'reflection\').value;save()">Save reflection</button></div>';}
else html+='<div class="card"><h2>Week notes</h2><textarea id="notes">'+esc(state.notes)+'</textarea><button class="btn" onclick="state.notes=document.getElementById(\'notes\').value;save()">Save notes</button></div>';
return html}
function library(){var html='<div class="eyebrow">Design vocabulary</div><h1>Learning Library</h1><p class="hero">Turn ideas into language you can use in critique, research, design decisions, and portfolio storytelling.</p><div class="card"><h2>Add a concept</h2><div class="field"><label>Term</label><input id="term"></div><div class="field"><label>Definition</label><textarea id="def"></textarea></div><div class="field"><label>Example / where I saw it</label><textarea id="ex"></textarea></div><button class="btn" onclick="addConcept()">Add concept</button></div>';state.concepts.forEach(function(c,i){html+='<div class="card"><div class="row"><span class="pill">'+esc(c.term)+'</span><button class="btn secondary" onclick="state.concepts.splice('+i+',1);save()">Delete</button></div><h3>'+esc(c.term)+'</h3><p>'+esc(c.def)+'</p><p class="small">'+esc(c.ex)+'</p></div>'});return html}
function addConcept(){var t=document.getElementById("term").value.trim();if(!t)return;state.concepts.unshift({term:t,def:document.getElementById("def").value,ex:document.getElementById("ex").value});save()}
function evidence(){var html='<div class="eyebrow">Applied practice</div><h1>Work & Evidence</h1><p class="hero">Log the work that proves what you are learning: research, IA, interaction design, evaluation, product thinking, and AI+UX.</p><div class="card"><h2>Add evidence</h2><div class="field"><label>Work item</label><input id="work"></div><div class="field"><label>Project / context</label><input id="project"></div><div class="field"><label>What did you do or learn?</label><textarea id="detail"></textarea></div><button class="btn" onclick="addEvidence()">Log work</button></div>';state.evidence.forEach(function(x){html+='<div class="card"><h3>'+esc(x.work)+'</h3><div class="small">'+esc(x.project)+'</div><p>'+esc(x.detail)+'</p></div>'});return html}
function addEvidence(){state.evidence.unshift({work:document.getElementById("work").value,project:document.getElementById("project").value,detail:document.getElementById("detail").value});save()}
function render(){var views={dashboard:dashboard,curriculum:curriculum,library:library,evidence:evidence};document.getElementById("app").innerHTML=views[page]()}
nav();render();
</script></body></html>
