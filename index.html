*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,sans-serif}.shell{display:flex;min-height:100vh}.side{width:245px;background:var(--green);color:#fff;padding:30px 20px;position:fixed;inset:0 auto 0 0}.brand{font:25px Georgia,serif}.sub{font-size:12px;color:#c7d4ce}.nav{margin-top:40px;display:grid;gap:6px}.nav button{background:none;border:0;color:#dbe5df;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#285546;color:#fff}.nav-spacer{flex:1}.work-btn{position:fixed;left:20px;bottom:22px;width:205px}.timer{position:fixed;left:20px;bottom:66px;width:205px;margin:0 12px 6px;font-size:12px;color:#dbe5df}.book{border-top:1px solid var(--line);padding:14px 0}.book summary{cursor:pointer;font-family:Georgia,serif;font-size:19px;list-style:none}.book summary::-webkit-details-marker{display:none}.book summary:before{content:'＋';color:var(--gold);display:inline-block;width:22px}.book[open] summary:before{content:'−'}.main{margin-left:245px;width:calc(100% - 245px);padding:42px clamp(25px,5vw,75px);max-width:1250px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--gold);font-weight:700}.hero h1,h1,h2,h3{font-family:Georgia,serif;font-weight:400}.hero h1{font-size:44px;line-height:1.08;margin:8px 0 14px}.hero p{max-width:720px;color:var(--muted);font-size:17px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}.stat b{display:block;font:30px Georgia,serif}.stat span,.small{color:var(--muted);font-size:12px}.card{margin:16px 0}.card h2{margin:0 0 10px;font-size:24px}.card h3{margin:0 0 6px;font-size:18px}.pill{display:inline-block;background:var(--sage);padding:4px 9px;border-radius:99px;font-size:12px;margin:3px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.q{background:var(--soft);border-left:3px solid var(--gold);padding:14px 16px;margin:14px 0}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}input,textarea,select{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);font:inherit}textarea{min-height:110px;resize:vertical}.btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:8px;padding:9px 14px;cursor:pointer}.btn.secondary{background:transparent;color:var(--green)}.btn:disabled{opacity:.42;cursor:default}.btn.complete{background:#e8e7e1;border-color:#d3d0c5;color:#7c827d}.task{border-top:1px solid var(--line)}.task:first-child{border-top:0}.task summary{list-style:none;cursor:pointer;padding:16px 4px;display:flex;align-items:center;gap:12px}.task summary::-webkit-details-marker{display:none}.task summary:before{content:'＋';font-size:18px;color:var(--gold);width:18px}.task[open] summary:before{content:'−'}.task-title{flex:1;font-family:Georgia,serif;font-size:18px}.task-check{width:20px;height:20px;accent-color:var(--green);margin:0}.task-body{padding:0 36px 18px}.task-body .q{margin-top:0}.task-status{font-size:11px;color:var(--muted);margin-left:auto}.task.done .task-title{text-decoration:line-through;color:var(--muted)}.obs{border-top:1px solid var(--line);padding:18px 0}.obs:first-of-type{border-top:0}.obs strong{font:18px Georgia,serif}.term-card{border-top:1px solid var(--line);padding:18px 0}.term-card:first-of-type{border-top:0}.progress{height:7px;background:#e5dfd3;border-radius:9px;overflow:hidden;margin:8px 0 10px}.progress span{display:block;height:100%;background:var(--green)}.phase-row{border-top:1px solid var(--line);padding:18px 0}.phase-row:first-of-type{border-top:0}.phase-head{display:flex;gap:18px;align-items:flex-start}.phase-num{font:26px Georgia,serif;color:var(--gold);min-width:28px}.phase-head h2{margin:0;font-size:22px}.unit-row{border-top:1px solid var(--line);padding:13px 0 13px 46px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.unit-row strong{font-family:Georgia,serif;font-weight:400}.unit-status{font-size:12px;color:var(--muted)}.unit-status.complete{color:var(--green);font-weight:600}.practice-row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:13px 0;border-top:1px solid var(--line)}.habit-grid{display:grid;grid-template-columns:1fr repeat(7,34px);gap:7px;align-items:center;font-size:12px}.habit-grid>div{min-height:28px;display:flex;align-items:center;justify-content:center}.habit-label{justify-content:flex-start!important;color:var(--muted)}.habit-dot{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:transparent}.habit-dot.done{background:var(--green);border-color:var(--green)}.book-meta{color:var(--muted);font-size:12px;margin:4px 0 14px}.library-meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.muted-box{background:#f2efe7;border-radius:9px;padding:12px 14px;color:var(--muted)}.theme-toggle{margin-top:18px;width:100%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:8px 12px;text-align:left;cursor:pointer}.dark{--ink:#e8eee9;--muted:#a9b7b0;--paper:#101613;--panel:#17201c;--line:#34423b;--green:#0d1713;--gold:#d0ad68;--sage:#294039;--soft:#202b26}.dark input,.dark textarea,.dark select{background:#111815;color:var(--ink);border-color:var(--line)}.dark .side{background:#0a100d}.dark .nav button{color:#b9c8c0}.dark .nav button.active,.dark .nav button:hover{background:#1d3b30;color:#fff}.dark .progress{background:#2a3530}.dark .muted-box{background:#202a26}.dark .habit-action{background:var(--panel);color:var(--ink)}.dark .habit-action.done,.dark .btn.complete{background:#303833;color:#9eaaa4;border-color:#454e49}.dark .unit-complete{color:#91c3a8}@media(max-width:800px){.side{position:static;width:100%;height:auto}.shell{display:block}.main{margin:0;width:100%;padding:28px 18px}.nav{display:flex;overflow:auto;margin-top:20px}.nav button{white-space:nowrap}.grid{grid-template-columns:1fr}.hero h1{font-size:36px}.unit-row{padding-left:10px}.habit-grid{grid-template-columns:1fr repeat(7,28px);gap:4px}}
.habit-actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.habit-action{border:1px solid var(--line);background:var(--panel);color:var(--green);border-radius:999px;padding:9px 14px;cursor:pointer}.habit-action.done{background:#e8e7e1;color:#7c827d;border-color:#d3d0c5}.core-head,.checkpoint-inline{display:flex;justify-content:space-between;align-items:center;gap:18px}.checkpoint-inline{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}.progress-compact{padding:14px 20px}.unit-complete{border-color:transparent;background:transparent;color:var(--green);font-weight:600}.history-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:12px 0}.history-card summary{cursor:pointer;list-style:none}.history-card summary::-webkit-details-marker{display:none}.history-card summary:before{content:"＋";color:var(--gold);display:inline-block;width:22px}.history-card[open] summary:before{content:"−"}.history-body{padding-top:18px}.history-body>.eyebrow{margin-top:18px}.history-body>.eyebrow:first-child{margin-top:0}@media(max-width:800px){.core-head,.checkpoint-inline{align-items:flex-start;flex-direction:column}} .lesson{margin:0 0 16px}.lesson h4{font:17px Georgia,serif;margin:18px 0 5px}.lesson p{margin:6px 0 12px}.lesson ul{margin:6px 0 14px;padding-left:22px}.lesson .q{margin:10px 0}.habit-week{max-width:210px}.habit-grid button.habit-dot{cursor:pointer;padding:0}.habit-grid button.habit-dot:focus{outline:2px solid var(--gold);outline-offset:2px}.habit-action{font:inherit}.habit-section{margin-top:18px}@media(max-width:800px){.habit-grid{grid-template-columns:minmax(130px,1fr) repeat(7,28px);font-size:11px}} </style></head><body>

<script>
var KEY="pdHciStudio";
var phaseData=[
{id:1,title:"HCI + Human Behavior",purpose:"Learn to see human behavior before trying to design solutions.",units:[
["HCI Foundations","How do people, technology, and context interact — and how do human limitations shape that interaction?"],
["Mental Models","What does a person believe is happening when they use something?"],
["Affordances, Signifiers & Discoverability","How does an interface communicate what I can do?"],
["Feedback, Mapping & Constraints","How does a system communicate what just happened and what I can do next?"],
["Cognition, Attention & Decision Making","How do human cognitive limitations affect design?"],
["Inclusive & Ethical Design","Who might struggle with this experience, and why?"]
]},
{id:2,title:"UX Research",purpose:"Learn to investigate problems rather than assume them.",units:[
["Research Foundations","What do I need to learn, and which method can give useful evidence?"],
["Research Planning","How do objectives, participants, ethics, and methods shape a study?"],
["Interviews","How can I ask neutral questions and learn about behavior?"],
["Contextual Inquiry & Observation","What can context, environment, and workarounds reveal?"],
["Surveys & Quantitative Research","When should I use structured quantitative evidence?"],
["Research Analysis","How do I turn raw observations into patterns and themes?"],
["Insights & Opportunity Areas","How do findings become insights and design implications?"],
["Research Project","Can I conduct and communicate a complete research cycle?"]
]},
{id:3,title:"Information Architecture",purpose:"Learn to organize complexity around human needs.",units:[
["IA Foundations","How do hierarchy, organization, classification, and content models shape findability?"],
["Navigation & Wayfinding","How do people know where they are and where they can go?"],
["Labels, Language & Search","How does language help people find the right thing?"],
["Filtering, Sorting & Progressive Disclosure","How can complexity be revealed without overwhelming people?"],
["Card Sorting & Tree Testing","How can users help validate an information structure?"],
["IA Package","Can I create a coherent information architecture for a real product?"]
]},
{id:4,title:"Interaction Design",purpose:"Turn understanding and structure into usable behavior.",units:[
["Interaction Foundations","How do goals, actions, states, and system response work together?"],
["Interaction Patterns","Which established patterns help people act with confidence?"],
["Navigation & Controls","How should selection, menus, tabs, and controls behave?"],
["Forms & Input","How can input be clear, efficient, and forgiving?"],
["Validation & Defaults","How do defaults and validation prevent unnecessary errors?"],
["Errors & Recovery","How should products support failure, undo, and recovery?"],
["States & Edge Cases","What should happen in loading, empty, offline, disabled, and partial states?"],
["Responsive & Complex Workflows","How should interactions adapt across devices and complex tasks?"]
]},
{id:5,title:"Product Design + Evaluation",purpose:"Move from designing experiences to making product decisions.",units:[
["Usability Testing","How can I observe whether people can actually use a design?"],
["Task Design & Moderation","How do I create useful tasks and avoid leading participants?"],
["Findings, Severity & Patterns","How do I turn usability observations into actionable findings?"],
["Iteration & Evidence","How should research change the product rather than just produce a report?"],
["Product Thinking","How do user needs, business goals, and technical constraints interact?"],
["Prioritization & Tradeoffs","How do I make and explain product tradeoffs?"],
["Metrics, Discovery & Experimentation","How can product decisions be connected to outcomes and evidence?"]
]},
{id:6,title:"Capstone + Portfolio",purpose:"Synthesize the entire process into substantial portfolio work.",units:[
["Choose the Problem","Define a meaningful problem and establish the project frame."],
["Research","Investigate the problem with appropriate methods and participants."],
["Synthesis & Definition","Turn evidence into a focused problem statement and opportunity areas."],
["Information Architecture","Create the structure that supports the identified user needs."],
["Concept & Interaction","Develop and prototype the experience and its key behaviors."],
["Visual Design","Develop a coherent visual system and polished interface."],
["Prototype, Evaluate & Accessibility","Test the design, identify issues, and audit accessibility."],
["Product Thinking & Iteration","Make MVP, metrics, constraints, tradeoffs, and roadmap decisions."],
["Case Study","Communicate the complete process, reasoning, evidence, and outcome."]
]}
];
var phaseNames=phaseData.map(function(p){return p.title});
var learningUnits=[];var weeks=[];phaseData.forEach(function(p){p.units.forEach(function(u,i){var id="p"+p.id+"u"+(i+1);learningUnits.push({id:id,phase:p.id,title:u[0],question:u[1]});weeks.push([u[0],u[1]])})});
function phaseFor(w){var u=learningUnits[Math.max(0,w-1)]||learningUnits[0];return u.phase}
function phaseUnits(pid){return learningUnits.filter(function(u){return u.phase===pid})}
var weekTasks={
1:[
{id:"read",title:"Read + actively annotate",prompt:"Read The Design of Everyday Things. Capture 3 moments where Norman describes a mismatch between what a person expects and what a product actually allows.",fields:[["moments","Your 3 moments","textarea"]]},
{id:"observe",title:"Observe 10 everyday interactions",prompt:"Observe before redesigning. For each interaction, record what you were trying to do, what you expected, what the design communicated, what happened, and where you hesitated or erred. Keep the entries brief; look for patterns after all 10.",fields:[["observation1","1. What did you observe?","text"],["observation2","2. What did you observe?","text"],["observation3","3. What did you observe?","text"],["observation4","4. What did you observe?","text"],["observation5","5. What did you observe?","text"],["observation6","6. What did you observe?","text"],["observation7","7. What did you observe?","text"],["observation8","8. What did you observe?","text"],["observation9","9. What did you observe?","text"],["observation10","10. What did you observe?","text"]]},
{id:"vocabulary",title:"Build your HCI vocabulary",prompt:"Work through the Week 1 terms in the Learning Library. For each, write your own understanding and connect it to something you observed.",fields:[["vocabularyNotes","Which concepts became clearer through observation? Give at least 3 examples.","textarea"]]},
{id:"apply",title:"Connect observation to HCI",prompt:"Choose one observation and explain what it reveals about the relationship between people, technology, and context.",fields:[["analysis","Your analysis","textarea"]]},
{id:"reflect",title:"Reflect",prompt:"Write: What did I notice this week that I would not have noticed before studying HCI?",fields:[["reflection","Your reflection","textarea"]]}
]};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
var DEFAULT_STATE={week:1,tasks:{},taskData:{},concepts:[],observations:[],reflection:"",notes:"",evidence:[],startDate:"",endDate:"",weekCompleted:{},unitCompleted:{},weeklyPractice:{},weeklyInputs:{},books:[],timer:{running:false,startedAt:0,total:0},theme:"light"};
var state;
try{state=JSON.parse(localStorage.getItem(KEY)||"null")||DEFAULT_STATE}catch(e){state=DEFAULT_STATE;try{localStorage.removeItem(KEY)}catch(ignore){}}
state.tasks=state.tasks||{};state.taskData=state.taskData||{};state.concepts=state.concepts||[];state.observations=state.observations||[];state.evidence=state.evidence||[];state.weekCompleted=state.weekCompleted||{};state.unitCompleted=state.unitCompleted||{};state.weeklyPractice=state.weeklyPractice||{};state.weeklyInputs=state.weeklyInputs||{};state.history=state.history||{};state.books=state.books||[];state.interfaceLogs=state.interfaceLogs||[];state.timer=state.timer||{running:false,startedAt:0,total:0};state.theme=state.theme||"light";state.habitLog=state.habitLog||{};state.habitWeek=state.habitWeek||state.week;function applyTheme(){document.documentElement.classList.toggle("dark",state.theme==="dark");var b=document.getElementById("themeToggle");if(b)b.textContent=state.theme==="dark"?"☀ Light mode":"☾ Dark mode"}function toggleTheme(){state.theme=state.theme==="dark"?"light":"dark";localStorage.setItem(KEY,JSON.stringify(state));applyTheme()}
// New or previously unstarted studios always begin with the first learning unit.
if(Object.keys(state.unitCompleted).length===0 && state.week>1){
  state.week=1;
  localStorage.setItem(KEY,JSON.stringify(state));
}
var page="dashboard";
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function go(p){page=p;nav();render()}
function nav(){var items=[["dashboard","Dashboard"],["syllabus","Syllabus"],["library","Design School Library"],["interface","Interface Practice"],["books","Books"],["history","Learning History"]];document.getElementById("nav").innerHTML=items.map(function(x){return '<button class="'+(page===x[0]?"active":"")+'" onclick="go(\''+x[0]+'\')">'+x[1]+"</button>"}).join("")}
function currentUnit(){return learningUnits[Math.max(0,state.week-1)]||learningUnits[0]}
var unitTasks={
"p1u1":[
{id:"learn",title:"Learn — HCI foundations",learn:"Human–Computer Interaction (HCI) studies how people interact with technology and the systems surrounding that interaction. A useful starting point is person + technology + context. People bring goals, prior experience, expectations, abilities, limitations, habits, and emotions. Technology brings rules, constraints, behavior, and feedback. Context includes the physical and social environment, time pressure, interruptions, and stakes.\n\nHCI looks at the relationship between these parts. When an interaction goes wrong, do not assume the person was careless or the interface was simply bad. First establish what the person was trying to do, what they expected, what the system communicated, and what actually happened. Observation comes before explanation; explanation comes before design.",task:"Read the relevant introduction or chapter of The Design of Everyday Things. In your own words, explain HCI and why the person, technology, and context must be considered together. Capture two or three ideas from the reading that changed or sharpened your understanding.",lookFor:"A useful explanation goes beyond “making interfaces easy to use.” It connects user goals and expectations with system behavior and context. Separate what you observed from what you infer.",output:"A short explanation of HCI plus 2–3 useful ideas from the reading.",fields:[["learningNotes","Explain HCI in your own words. What are 2–3 ideas worth keeping?","textarea"]]},
{id:"observe",title:"Observe — 10 everyday interactions",learn:"An observation records what happened; an interpretation proposes why it happened. Keeping them separate protects you from designing around assumptions. Small moments—hesitation, repeated taps, checking for confirmation, looking around for a control—can reveal a mismatch between a person's goal and what the system communicates.",task:"Record 10 interactions with physical products, digital interfaces, or environments. For each, write a brief note covering: goal, expectation, what the design communicated, actual result, and any hesitation or error. Possible examples: a door, elevator, coffee machine, parking meter, checkout, thermostat, map, or settings screen. Do not redesign anything yet. After all ten, identify one to three patterns across the observations.",lookFor:"Specific behavior and context, not ratings like “good UX” or guesses about what someone was thinking. Use “I expected…” for your expectation and describe the observable event separately.",output:"10 concise observations and 1–3 patterns.",fields:[["observation1","1. Interaction — goal, expectation, signal, result, friction","text"],["observation2","2. Interaction — goal, expectation, signal, result, friction","text"],["observation3","3. Interaction — goal, expectation, signal, result, friction","text"],["observation4","4. Interaction — goal, expectation, signal, result, friction","text"],["observation5","5. Interaction — goal, expectation, signal, result, friction","text"],["observation6","6. Interaction — goal, expectation, signal, result, friction","text"],["observation7","7. Interaction — goal, expectation, signal, result, friction","text"],["observation8","8. Interaction — goal, expectation, signal, result, friction","text"],["observation9","9. Interaction — goal, expectation, signal, result, friction","text"],["observation10","10. Interaction — goal, expectation, signal, result, friction","text"],["patterns","What 1–3 patterns appeared across the observations?","textarea"]]},
{id:"apply",title:"Analyze — connect an observation to HCI",learn:"HCI analysis moves from an event to a reasoned interpretation. A useful chain is: observation → interpretation → relevant concept → design implication. The concept should explain something about the interaction; it should not be a label added after the fact.",task:"Choose one of your observations. Explain what it reveals about the relationship between the person, technology, and context. Connect it to one relevant concept, such as expectation, feedback, discoverability, mental model, or cognitive load. State what you know and what you are only hypothesizing.",lookFor:"A clear link between the evidence and the concept. Avoid jumping straight to a fix such as “make the button bigger.” First explain what happened and why it may matter.",output:"One short evidence-based HCI analysis.",fields:[["analysis","Observation → interpretation → concept → implication","textarea"]]},
{id:"case",title:"Case study — diagnose before redesigning",learn:"Don Norman's everyday examples show how ordinary design decisions can create predictable errors. The goal of a case study is not to criticize a product in general; it is to explain a specific interaction and the mismatch that makes it difficult.",task:"Use an example from The Design of Everyday Things (such as a door that does not communicate whether to push or pull). Identify the user's goal, expectation, design cues, actual behavior, and failure point. Explain the HCI principle that best accounts for the problem. You may read the assigned section through the Reading habit.",lookFor:"A specific explanation of the failure grounded in the example. A redesign suggestion can be noted, but diagnosis comes first.",output:"A compact case analysis.",fields:[["caseStudy","Goal, expectation, cues, behavior, failure point, principle","textarea"]]},
{id:"reflect",title:"Reflect — accessibility + weekly review",learn:"Reflection is useful when it records a change in your reasoning or a question that can guide the next unit. Accessibility review is a recurring design habit, not a full formal audit every week.",task:"Review one screen, product, or flow you used this week. Note what you checked, one thing that works well, and one thing you would improve. Then answer the weekly review questions.",lookFor:"Specific checks and observations. Avoid claiming WCAG compliance based on a quick review; describe what you actually inspected.",output:"A brief accessibility review and a useful weekly reflection.",fields:[["accessibilityChecked","Accessibility — what did I check?","textarea"],["accessibilityWorks","What worked well?","textarea"],["accessibilityImprove","What would I improve, and why?","textarea"],["reflection","What changed in how I think? What surprised me? What is still unclear?","textarea"]]}
],
"p1u2":[
{id:"learn",title:"Learn — mental models",learn:"A mental model is a person's internal understanding of how something works. People build these models from experience, conventions, labels, feedback, and what a product appears to do. A system model is how the system actually works. A conceptual model is the explanation of the system that the design presents to users. These models can differ.\n\nFor example, a person may expect a setting to apply immediately because the interface makes the change look complete, while the system waits for a separate Save action. The design challenge is not to teach users the internal technology; it is to help them form a model that lets them predict what will happen.",task:"Read the mental-model section of your assigned material. Explain the difference between a user's mental model and the system's actual behavior. Include a concrete example.",lookFor:"Clearly separate belief, communicated design, and actual system behavior. A mental model is an expectation—not simply a user's preference.",output:"A short explanation and one example.",fields:[["learningNotes","Define mental model in your own words and explain the distinction.","textarea"]]},
{id:"analyze",title:"Analyze — three products",learn:"Mental models are easiest to see when you ask what a person expects to happen next. Familiar products can still have hidden rules, ambiguous modes, or delayed effects.",task:"Analyze a thermostat, a car gear selector, and a digital interface such as iOS Settings. For each, describe the user's likely expectation, what the system actually does, what the design communicates, and where the model could break down.",lookFor:"Explain the expectation underneath the behavior. If you are unsure how a system works, label it as a hypothesis rather than inventing certainty.",output:"Three brief mental-model analyses.",fields:[["caseStudies","Thermostat, gear selector, and digital interface","textarea"]]},
{id:"apply",title:"Apply — map user model vs. system model",learn:"A mismatch matters when it changes what people predict, choose, or do. Mapping the two models makes the gap visible and helps you avoid vague conclusions like “the UI is confusing.”",task:"Choose one product and write two columns: what the user likely believes and what the system actually does. Identify the evidence that suggests a mismatch, its consequence, and what additional information you would need to confirm your interpretation.",lookFor:"A plausible, evidence-aware comparison. Do not treat an untested assumption about users as a proven fact.",output:"One user-model/system-model comparison.",fields:[["modelMap","User mental model vs. system model; evidence and uncertainty","textarea"]]},
{id:"reflect",title:"Reflect — capture + review",learn:"Add concepts to the Design School Library when you can explain them in your own words and connect them to an example. The Library is your long-term reference; the unit response is where you work through this week's question.",task:"Add Mental Model to the Design School Library using your own definition, example, why it matters, and an open question. Complete the accessibility review and weekly reflection below.",lookFor:"A definition you could explain to a teammate, plus an example that demonstrates the concept rather than merely naming it.",output:"A saved Library concept, accessibility review, and weekly reflection.",fields:[["accessibilityChecked","Accessibility — what did I check?","textarea"],["accessibilityWorks","What worked well?","textarea"],["accessibilityImprove","What would I improve, and why?","textarea"],["reflection","What changed in how you interpret user expectations? What remains unclear?","textarea"]]}
],
"p1u3":[
{id:"learn",title:"Learn — affordances, signifiers, discoverability",learn:"An affordance is an action an object or system makes possible. A perceived affordance is what a person believes they can do. A signifier is a cue that communicates where or how to act. Discoverability describes how readily someone can find available actions. These ideas are related but not interchangeable: a system may support an action without making it visible or understandable.",task:"Write a brief definition of each term and explain how they differ. Use one physical and one digital example.",lookFor:"You distinguish the action that is possible from the cue that communicates it. Avoid using “affordance” as a catch-all word for any visual styling.",output:"Definitions and two grounded examples.",fields:[["learningNotes","Affordance vs. perceived affordance vs. signifier vs. discoverability","textarea"]]},
{id:"analyze",title:"Analyze — five interactions",learn:"A control can be functional yet difficult to discover. Visual weight, placement, labels, conventions, and context all shape whether people notice and understand an action.",task:"Examine five physical or digital interactions, including one physical object, one familiar digital pattern, and one interaction you find unclear. For each, note the available action, the signifier, the expected behavior, and whether the actual behavior matches.",lookFor:"Name the cue that communicates the action and explain how it shapes expectation. Be specific about what a person can see or encounter.",output:"Five short analyses.",fields:[["examples","Five interactions and their action cues","textarea"]]},
{id:"apply",title:"Apply — diagnose discoverability",learn:"Discoverability problems often appear when an action is hidden, a cue is ambiguous, or the cue suggests behavior the system does not support.",task:"Compare two interfaces that perform a similar task. Identify which makes the action easier to discover and explain why. Then document one weak interaction as: available action → signifier → expectation → actual behavior.",lookFor:"Reasoning tied to observable evidence—not simply which design looks cleaner or more attractive.",output:"A comparison and one interaction diagnosis.",fields:[["analysis","Compare interfaces and map one discoverability problem","textarea"]]},
{id:"reflect",title:"Reflect — accessibility + weekly review",learn:"Discoverability and accessibility overlap: an action that relies only on color, a hidden gesture, or a tiny target may be unavailable to some users.",task:"Review one interface for visible action cues, labels, focus, contrast, and touch targets. Record your checks and weekly reflection.",lookFor:"Identify who may encounter a barrier and why, while being clear about the limits of your quick review.",output:"Accessibility review and reflection.",fields:[["accessibilityChecked","What did I check?","textarea"],["accessibilityWorks","What worked well?","textarea"],["accessibilityImprove","What would I improve, and why?","textarea"],["reflection","What makes an action feel obvious? Where might familiarity hide a discoverability problem?","textarea"]]}
],
"p1u4":[
{id:"learn",title:"Learn — feedback, mapping, constraints",learn:"Feedback tells people what happened after an action. Mapping describes the relationship between a control and its effect. Constraints limit available actions and can prevent errors. Together they help people understand system state and choose what to do next. Feedback is useful when it is timely, perceivable, and specific enough to support a decision.",task:"Define feedback, system status, mapping, natural mapping, and constraints. Include an example of how each can support or hinder an interaction.",lookFor:"Explain what a design cue helps the person understand or predict. “It gives feedback” is incomplete unless you say what the feedback communicates.",output:"A compact concept guide with examples.",fields:[["learningNotes","Definitions and examples","textarea"]]},
{id:"analyze",title:"Analyze — interaction loops",learn:"An interaction can be analyzed as action → system response → user interpretation → next action. Missing, delayed, or ambiguous feedback can leave someone unsure whether an action worked.",task:"Analyze a microwave, elevator, form submission, and one loading/success/error state. For each, identify the action, response, what the user can infer, and what they can do next.",lookFor:"Connect the response to the user's decision. Note where a state is invisible or where control-to-effect mapping is hard to understand.",output:"Four interaction-loop analyses.",fields:[["examples","Microwave, elevator, form, and digital state","textarea"]]},
{id:"apply",title:"Apply — diagnose one interaction",learn:"Good diagnosis identifies the exact point where the interaction stops communicating clearly. It may be missing feedback, a poor control-to-effect relationship, or a lack of constraints that would prevent a predictable error.",task:"Choose one interaction. Describe the feedback, when it appears, whether it is understandable, what happens if it is delayed or missing, and which constraint (if any) helps prevent errors. Propose one change and justify it.",lookFor:"A clear link between the interaction evidence and the proposed change. Don't add confirmation or friction automatically; explain the user need it serves.",output:"One interaction analysis with a justified improvement.",fields:[["analysis","Action → response → interpretation → next action; recommendation","textarea"]]},
{id:"reflect",title:"Reflect — accessibility + weekly review",learn:"Feedback must be perceivable in different conditions and should not rely only on color, sound, or motion. Clear error recovery is part of an inclusive interaction.",task:"Inspect one interaction's status, feedback, and error recovery. Record the accessibility checks and weekly review.",lookFor:"State what the system communicates and what a person might miss. Distinguish an observed issue from a possible risk.",output:"Accessibility review and reflection.",fields:[["accessibilityChecked","What did I check?","textarea"],["accessibilityWorks","What worked well?","textarea"],["accessibilityImprove","What would I improve, and why?","textarea"],["reflection","Which interaction made system state clear or unclear? Why?","textarea"]]}
],
"p1u5":[
{id:"learn",title:"Learn — cognition and decision making",learn:"People have limited attention, working memory, and time. Recognition is usually easier than recall because the interface supplies cues instead of asking a person to retrieve information from memory. Cognitive load rises when people must keep too much in mind, interpret unclear labels, compare many options, or recover from interruptions. Hick's Law describes the relationship between the number of choices and decision time; Fitts's Law relates target size and distance to the time needed to acquire a target. These are useful lenses, not universal formulas for every interface.",task:"Explain cognitive load, attention, memory, recognition vs. recall, Hick's Law, and Fitts's Law in your own words. Give one practical example for at least three concepts.",lookFor:"Definitions connected to interface behavior. Avoid treating laws as guarantees or reducing cognitive load to the number of elements on a screen.",output:"A concise concept sheet with examples.",fields:[["learningNotes","Explain the concepts and include examples.","textarea"]]},
{id:"analyze",title:"Analyze — three experiences",learn:"Interfaces distribute cognitive work. They can support people with labels, sensible defaults, visible choices, grouping, and reminders—or burden them with memory, interpretation, and unnecessary decisions.",task:"Audit Google Search, a checkout flow, and an ATM or banking interaction. For each, note what users must remember, what they can recognize, what decisions they make, and where attention or action may become difficult.",lookFor:"Describe the cognitive work being asked of the person, not just whether the screen looks busy. Consider context, stakes, and user familiarity.",output:"Three cognitive-load analyses.",fields:[["examples","Google Search, checkout, and ATM/banking","textarea"]]},
{id:"apply",title:"Apply — cognitive-load audit",learn:"A useful audit separates work the interface supports from work it unnecessarily shifts onto the user. Not all complexity can be removed; the goal is to make necessary complexity understandable and manageable.",task:"Choose one experience and list what helps the user think and what makes the user think unnecessarily. Identify one change, the cognitive burden it would reduce, and a tradeoff to consider.",lookFor:"A specific mechanism—memory, decision-making, attention, interpretation, or motor precision—and a reasoned improvement.",output:"A focused cognitive-load audit.",fields:[["analysis","Helps the user think vs. unnecessary cognitive work; proposed change","textarea"]]},
{id:"reflect",title:"Reflect — accessibility + weekly review",learn:"Cognitive accessibility includes reducing avoidable memory demands, making instructions clear, and helping people recover after interruption or error.",task:"Review one flow for memory demands, decision load, clear language, and recovery. Complete your weekly reflection.",lookFor:"Consider people under different conditions rather than assuming every user is attentive, experienced, and uninterrupted.",output:"Accessibility review and reflection.",fields:[["accessibilityChecked","What did I check?","textarea"],["accessibilityWorks","What worked well?","textarea"],["accessibilityImprove","What would I improve, and why?","textarea"],["reflection","What cognitive work did you notice that you previously overlooked?","textarea"]]}
],
"p1u6":[
{id:"learn",title:"Learn — inclusive and ethical design",learn:"Inclusive design considers variation in ability, language, experience, context, and access from the start. Accessibility is one essential part of that work. WCAG provides testable guidance for making web content more perceivable, operable, understandable, and robust. Ethical design also asks who benefits, who bears the cost, what assumptions are embedded, and whether people have meaningful control. A quick review can reveal issues, but it cannot prove a product fully conforms to WCAG.",task:"Review the foundations of WCAG and inclusive design. Explain the four WCAG principles and describe how cognitive accessibility, bias, and edge cases affect product decisions.",lookFor:"Connect guidelines to real barriers and people’s ability to complete tasks. Avoid treating accessibility as a special case or a final polish pass.",output:"A concise explanation of inclusive design and the WCAG principles.",fields:[["learningNotes","Explain inclusive design, the four WCAG principles, and one ethical consideration.","textarea"]]},
{id:"audit",title:"Analyze — accessibility audit",learn:"An audit is more useful when each issue is connected to a task and a potential barrier. Examples include keyboard traps, missing labels, low contrast, small targets, unclear errors, motion that cannot be reduced, or instructions that rely on memory.",task:"Choose one screen or flow and inspect keyboard access, focus visibility/order, contrast, touch targets, labels and instructions, error messages, color dependence, motion, and cognitive load. Record what you actually checked and any limitations.",lookFor:"Specific evidence and a clear account of who might be blocked or burdened. Do not claim a complete compliance audit unless you have performed the appropriate tests.",output:"A focused accessibility audit with evidence and limitations.",fields:[["audit","Screen/flow, checks performed, findings, possible barriers, and limitations","textarea"]]},
{id:"apply",title:"Apply — prioritize one barrier",learn:"A useful recommendation identifies the barrier, the affected task, who may encounter it, and why the proposed change is likely to help. Prioritization should consider impact and frequency as well as effort.",task:"Select one issue from your audit. Explain the barrier, the people or situations it may affect, the evidence you have, and a proposed improvement. State how you would verify the change.",lookFor:"A traceable chain from design decision to human need to potential barrier. Name what remains uncertain and how you would test it.",output:"One justified, testable accessibility recommendation.",fields:[["recommendation","Barrier → affected task/person → evidence → improvement → validation","textarea"]]},
{id:"reflect",title:"Reflect — phase review",learn:"This phase trained observation and diagnosis before solution generation. Your next phase moves from individual observations toward systematic research: questions, methods, participants, evidence, and synthesis.",task:"Complete the recurring accessibility review and weekly reflection. Then summarize what you can now notice or explain that you could not at the start of Phase 1.",lookFor:"Use examples from your work to show growth. Identify one skill that still needs deliberate practice.",output:"Accessibility review, reflection, and a short Phase 1 synthesis.",fields:[["accessibilityChecked","What did I check?","textarea"],["accessibilityWorks","What worked well?","textarea"],["accessibilityImprove","What would I improve, and why?","textarea"],["reflection","What can you now explain about human interaction? What still needs practice?","textarea"]]}
]
};

function taskComplete(k,t){if(state.tasks[k])return true;var d=state.taskData[k]||{};return t.fields.every(function(f){return String(d[f[0]]||"").trim().length>0})}
function taskHtml(t,index,w){var k=w+"-"+t.id,d=state.taskData[k]||{},complete=taskComplete(k,t);var fields=t.fields.map(function(f){var tag=f[2]==="textarea"?'<textarea data-task="'+esc(k)+'" data-field="'+esc(f[0])+'" oninput="saveTaskField(this)">'+esc(d[f[0]])+"</textarea>":'<input data-task="'+esc(k)+'" data-field="'+esc(f[0])+'" value="'+esc(d[f[0]])+'" oninput="saveTaskField(this)">';return '<div class="field"><label>'+esc(f[1])+'</label>'+tag+"</div>"}).join("");function paragraphs(s){return String(s||"").split(/\n\n/).map(function(p){return "<p>"+esc(p).replace(/\n/g,"<br>")+"</p>"}).join("")}var lesson='<div class="lesson"><h4>Learn</h4>'+paragraphs(t.learn)+'<h4>Your task</h4><p>'+esc(t.task||t.prompt||"Complete the activity below.")+'</p><h4>What I’m looking for</h4><div class="q">'+esc(t.lookFor||"Use specific evidence and explain your reasoning.")+'</div><h4>Output</h4><p>'+esc(t.output||"A concise record of your work.")+'</p></div>';return '<details class="task" '+(complete?"":"open")+'><summary><span class="task-title">'+(index+1)+'. '+esc(t.title)+'</span><span class="task-status">'+(complete?"Complete":"In progress")+'</span><input class="task-check" type="checkbox" '+(state.tasks[k]?"checked":"")+' '+(complete?"":"disabled")+' onclick="event.stopPropagation();toggleTask(\''+esc(k)+'\',this.checked)"></summary><div class="task-body">'+lesson+fields+'</div></details>'}
function saveTaskField(el){var k=el.dataset.task;state.taskData[k]=state.taskData[k]||{};state.taskData[k][el.dataset.field]=el.value;localStorage.setItem(KEY,JSON.stringify(state));var t=currentTasks(state.week).filter(function(x){return state.week+"-"+x.id===k})[0];if(t){var status=taskComplete(k,t);var root=el.closest(".task");var s=root.querySelector(".task-status");if(s)s.textContent=status?"Complete":"In progress";var c=root.querySelector(".task-check");if(c)c.disabled=!status}}

function guide(){return '<div class="eyebrow">The Studio</div><h1>Product Design + HCI Studio</h1><p class="hero">A structured path toward formal-level HCI knowledge, strong interaction and visual design skills, research capability, product thinking, and enough technical fluency to work closely with engineers.</p><div class="grid"><div class="stat"><b>HCI</b><span>Understand people.</span></div><div class="stat"><b>Design</b><span>Turn understanding into experiences.</span></div><div class="stat"><b>Product</b><span>Make those experiences useful, feasible, and valuable.</span></div></div><div class="card"><div class="eyebrow">The outcome</div><h2>What this studio is building toward</h2><p>By the end, you should be able to walk into a Product or UX Design interview and comfortably say:</p><div class="q">“I can understand a problem, research it, make sense of complex information, define an experience, design and prototype a solution, evaluate it with users, work with engineers and PMs, and explain why I made the decisions I made.”</div><p class="small">The goal is not to memorize UX vocabulary. It is to build the reasoning, practice, and evidence to support that statement.</p></div><div class="card"><div class="eyebrow">The rhythm</div><h2>Learn → Apply → Critique → Reflect → Repeat</h2><p>Each week should move between learning concepts, applying them to real work, examining the quality of the result, and reflecting on what changed in your thinking.</p><div class="grid"><div class="stat"><b>1 hr</b><span>Learn — book, course, article, or lecture.</span></div><div class="stat"><b>1 hr</b><span>Analyze — study a real product or interface.</span></div><div class="stat"><b>2–3 hrs</b><span>Build — apply the concept to your current project.</span></div><div class="stat"><b>1 hr</b><span>Research / test / critique — depending on the phase.</span></div><div class="stat"><b>30 min</b><span>Reflect — capture what changed.</span></div></div></div><div class="card"><div class="eyebrow">Design School Notebook</div><h2>Your personal UX / HCI reference library</h2><p>Keep one living notebook alongside the Studio. Every week, turn what you learned into a piece of design reasoning rather than another completed lesson.</p><div class="grid"><div class="stat"><b>Concept</b><span>Progressive disclosure, mental models, feedback, etc.</span></div><div class="stat"><b>Definition</b><span>The formal definition.</span></div><div class="stat"><b>Your explanation</b><span>Explain it in your own words.</span></div><div class="stat"><b>Example</b><span>A screenshot or example from a real product.</span></div><div class="stat"><b>Why it works</b><span>Your analysis of the design.</span></div><div class="stat"><b>Counterexample</b><span>Something that handles the idea poorly.</span></div><div class="stat"><b>Application</b><span>How you could use the concept.</span></div><div class="stat"><b>Question</b><span>Something you still do not understand.</span></div></div><div class="q">Over time, this becomes your personal UX / HCI reference library — and eventually something more valuable than a list of certificates: a body of design reasoning.</div></div><div class="card"><div class="eyebrow">Weekly interface practice</div><h2>Study one excellent interface</h2><p>Spend 30 minutes analyzing it, then recreate a small portion. The goal is to develop visual and interaction judgment by looking closely at decisions other designers made.</p><div class="grid"><div class="stat"><b>Typography</b><span>Why this typeface?</span></div><div class="stat"><b>Spacing</b><span>Why this spacing and rhythm?</span></div><div class="stat"><b>Hierarchy</b><span>Why is information ordered this way?</span></div><div class="stat"><b>Color</b><span>Why this color and contrast?</span></div><div class="stat"><b>Interaction</b><span>Why this interaction pattern?</span></div><div class="stat"><b>Density</b><span>Why this amount of information?</span></div><div class="stat"><b>Components</b><span>Why this component?</span></div><div class="stat"><b>Responsive</b><span>What happens when the viewport changes?</span></div></div></div><div class="card"><div class="eyebrow">Accessibility is part of design</div><h2>Build accessibility into the work</h2><p>Accessibility is not a separate final checklist. Throughout the Studio, you will practice thinking about:</p><div class="row"><span class="pill">WCAG concepts</span><span class="pill">Keyboard navigation</span><span class="pill">Focus states</span><span class="pill">Color contrast</span><span class="pill">Screen readers</span><span class="pill">Semantic structure</span><span class="pill">Touch targets</span><span class="pill">Motion</span><span class="pill">Cognitive accessibility</span><span class="pill">Accessible forms</span><span class="pill">Error messaging</span></div><div class="q">The expectation is that you actually audit your own designs — not simply know the terminology.</div></div><div class="card"><div class="eyebrow">Reflection</div><h2>End each week by asking</h2><div class="q"><p><strong>What did I learn?</strong></p><p><strong>What changed my mind?</strong></p><p><strong>What would I do differently?</strong></p></div></div>'}

function dashboard(){var w=state.week,u=unitForWeek(w),phase=phaseData[u.phase-1],tasks=currentTasks(w),done=tasks.filter(function(t){return taskComplete(w+"-"+t.id,t)}).length,unitDone=!!state.unitCompleted[u.id],input=state.weeklyInputs[w]||{};var core=tasks.map(function(t,i){return taskHtml(t,i,w)}).join("");var habits=[["Reading","books"],["Interface Practice","interface"],["Design School Library","library"],["Review","review"]];var habitWeek=state.habitWeek||w;var habitLog=state.habitLog||{};var log=habitLog[habitWeek]||{};var days=["M","T","W","T","F","S","S"];var rows=habits.map(function(h){return '<div class="habit-label">'+h[0]+'</div>'+days.map(function(_,i){var yes=!!(log[h[0]]&&log[h[0]][i]);return '<div><button class="habit-dot '+(yes?'done':'')+'" aria-label="'+esc(h[0])+' '+days[i]+'" title="Toggle '+esc(h[0])+' for day '+(i+1)+'" onclick="toggleHabit('+habitWeek+',\''+h[0]+'\','+i+')"></button></div>'}).join("")}).join("");return '<section class="hero"><div class="eyebrow">Current learning</div><h1>'+esc(u.title)+'</h1><p>'+esc(u.question)+'</p><div class="small" style="margin-top:-6px;margin-bottom:10px">Phase '+u.phase+' · '+esc(phase.title)+' · '+done+'/'+tasks.length+' core activities ready</div></section><div class="card"><div class="eyebrow">Weekly Habits</div><h2>Keep the practice going</h2><p>Choose a habit to open its workspace. Mark the days you worked on it; each week stays available so you can review your actual rhythm.</p><div class="habit-actions"><button class="habit-action" onclick="go(\'books\')">Reading ↗</button><button class="habit-action" onclick="go(\'interface\')">Interface Practice ↗</button><button class="habit-action" onclick="go(\'library\')">Design School Library ↗</button><button class="habit-action" onclick="focusReview()">Review ↓</button></div><div class="field"><label for="habitWeek">Habit tracking week</label><select id="habitWeek" class="habit-week" onchange="changeHabitWeek(this.value)">'+Array.from({length:Math.max(learningUnits.length,w,habitWeek)},function(_,i){var n=i+1;return '<option value="'+n+'" '+(n===habitWeek?'selected':'')+'>Week '+n+(n===w?' · current':'')+'</option>'}).join("")+'</select></div><div class="habit-grid"><div></div>'+days.map(function(x){return '<div>'+x+'</div>'}).join("")+rows+'</div><p class="small">Select any week to view or update its daily checks. These are manual logs, not automatic completion signals.</p></div><div class="card core-learning"><div class="core-head"><div><div class="eyebrow">Phase '+u.phase+' · '+esc(phase.title)+'</div><h2>'+esc(u.question)+'</h2><p class="small">'+done+'/'+tasks.length+' activities complete · Open each section for the lesson, assignment, success criteria, and output.</p></div><div class="row"><button class="btn secondary" onclick="toggleCore(false)">Collapse all</button></div></div>'+core+'<div class="checkpoint-inline"><div><strong>'+(unitDone?'Learning unit complete':'Checkpoint')+'</strong><div class="small">'+(unitDone?'Completed '+formatDate(new Date(state.unitCompleted[u.id])):'Finish the required core activities, then save this unit to Learning History.')+'</div></div><button class="btn '+(unitDone?'complete':'')+'" '+(unitDone?'disabled':'onclick="completeUnit()"')+'>'+(unitDone?'Completed ✓':'Complete learning unit')+'</button></div></div><div class="card" id="weeklyReview"><div class="eyebrow">Reflect</div><h2>Accessibility review + weekly review</h2><div class="field"><label>Accessibility — what I checked</label><p class="small">'+esc(accessibilityGuidance())+'</p><textarea id="dashAccessibility" placeholder="List the checks you performed and what you found…">'+esc(input.accessibilityText||"")+'</textarea></div><div class="field"><label>What worked well?</label><textarea id="dashAccessWorks">'+esc(input.accessibilityWorks||"")+'</textarea></div><div class="field"><label>What would I improve, and why?</label><textarea id="dashAccessImprove">'+esc(input.accessibilityImprove||"")+'</textarea></div><div class="field"><label>Weekly review — what changed, surprised me, or remains unclear?</label><textarea id="trackerReflection" placeholder="Use a concrete example where possible.">'+esc(input.reflection||"")+'</textarea></div><div class="field"><label>Something I want to investigate further</label><textarea id="dashQuestion">'+esc(input.question||"")+'</textarea></div><button class="btn secondary" onclick="saveDashboardInputs()">Save review</button></div>'}

var weekOneTerms=[
["HCI","What is HCI actually concerned with beyond making interfaces look good? How do people, technology, and context interact?"],
["Human-centered design","What does it mean to design around people’s needs, abilities, goals, and context rather than around technology alone?"],
["Mental model","What does a person believe is happening when they use a product? Where might that expectation differ from how the system actually works?"],
["Affordance","What actions does an object or interface make possible? Which possibilities are physically or digitally supported?"],
["Signifier","What tells a person what action is possible or where/how to act? What visual, physical, or contextual cues are doing the communicating?"],
["Feedback","How does the system communicate the result of an action? What would happen if the user received no feedback?"],
["Mapping","How clearly does the relationship between a control and its effect correspond to what the person expects?"],
["Constraint","What limits the possible actions and helps prevent errors or confusion? Is the constraint physical, logical, semantic, or cultural?"],
["Discoverability","Can a person figure out what they can do without being told? What makes an action easy or difficult to discover?"],
["Error","What happened when the interaction did not go as expected? Was the error caused by the person, the design, the system, or the context?"],
["Recognition vs. recall","Does the design let people recognize useful information instead of making them remember it? Where did you see the difference?"]

function syllabus(){var total=learningUnits.length,done=learningUnits.filter(function(u){return !!state.unitCompleted[u.id]}).length,overall=Math.round(done/total*100);var journey=phaseData.map(function(p){var pr=phaseProgress(p.id),units=phaseUnits(p.id);return '<div class="phase-row"><details '+(p.id===phaseFor(state.week)?"open":"")+'><summary class="phase-head"><span class="phase-num">'+p.id+'.</span><div style="flex:1"><h2>'+esc(p.title)+'</h2><div class="small">'+esc(p.purpose)+'</div><div class="progress"><span style="width:'+pr.pct+'%"></span></div><div class="small">'+pr.done+'/'+pr.total+' learning units · '+pr.pct+'%</div></div></summary><div style="margin-top:12px">'+units.map(function(u){var complete=!!state.unitCompleted[u.id],current=u.id===unitForWeek(state.week).id;return '<div class="unit-row"><div><button class="btn '+(complete?'unit-complete':'secondary')+'" onclick="openUnit(this.dataset.unit)" data-unit="'+u.id+'">'+esc(u.title)+'</button><div class="small">'+esc(u.question)+'</div></div><div class="unit-status '+(complete?'complete':'')+'">'+(complete?'✓ Completed · '+formatDate(new Date(state.unitCompleted[u.id])):(current?'Current':'Not started'))+'</div></div>'}).join("")+'</div></details></div>'}).join("");return '<h1>Product Design + HCI Studio</h1><div class="card"><div class="eyebrow">How this works</div><p class="hero">A 9–12 month, checkpoint-based curriculum with weekly checkpoints.<br><em>Suggested pace: ~5–7 hours/week. The 44-week timeline is a pacing estimate, not a rigid deadline.</em></p><div style="margin:22px 0 14px;padding:14px 16px;background:var(--soft);border-left:3px solid var(--gold);border-radius:8px;font:18px Georgia,serif;color:var(--ink)">Learn → Capture → Observe → Apply → Critique → Reflect → Evidence</div><p>Learn the concepts, apply them to real products and problems, reflect on your decisions, and capture evidence of what you can do.</p><p>Interface Practice · Design School Library · Accessibility · AI + UX</p></div><div class="card progress-compact"><div class="eyebrow">Overall progress</div><div class="progress"><span style="width:'+overall+'%"></span></div><div class="small">'+done+'/'+total+' · '+overall+'% · Current: '+esc(unitForWeek(state.week).title)+'</div></div><div class="card"><div class="eyebrow">Your journey</div>'+journey+'</div><div class="card"><div class="eyebrow">Graduation</div><h2>Leave with a body of evidence</h2><p>Observation, research, IA, interaction design, evaluation, product decisions, and a substantial capstone case study.</p></div>'}
function interface(){var logs=state.interfaceLogs||[];return '<div class="eyebrow">Weekly design judgment</div><h1>Interface Practice</h1><p class="hero">Analyze → Recreate → Explain. Study one excellent interface closely for about 30 minutes, then recreate a small portion.</p><div class="card"><h2>Practice log</h2><div class="field"><label>Product / interface</label><input id="ipProduct"></div><div class="field"><label>Link + image</label><div class="row" style="align-items:stretch"><input id="ipFigma" type="url" placeholder="https://..." style="flex:1"><input id="ipImage" type="file" accept="image/*" onchange="previewInterfaceImage(this)" style="display:none"><label class="btn secondary" for="ipImage" style="display:inline-flex;align-items:center;cursor:pointer;white-space:nowrap">Upload image</label></div><div id="ipImagePreview"></div></div><div class="field"><label>What I analyzed</label><textarea id="ipAnalyze"></textarea></div><div class="grid"><div class="field"><label>Typography</label><textarea id="ipType"></textarea></div><div class="field"><label>Spacing / hierarchy</label><textarea id="ipSpace"></textarea></div><div class="field"><label>Color</label><textarea id="ipColor"></textarea></div><div class="field"><label>Interaction</label><textarea id="ipInteraction"></textarea></div><div class="field"><label>Density / components</label><textarea id="ipDensity"></textarea></div><div class="field"><label>Responsive behavior</label><textarea id="ipResponsive"></textarea></div></div><div class="field"><label>What I recreated</label><textarea id="ipRecreated"></textarea></div><div class="field"><label>What I learned</label><textarea id="ipLearned"></textarea></div><button class="btn" onclick="addInterfacePractice()">Save practice</button></div><div class="card"><h2>Practice history</h2>'+logs.map(function(x){return '<div class="term-card"><h3>'+esc(x.product)+'</h3><div class="small">'+esc(x.date||'')+'</div>'+(x.figma?'<p><a href="'+esc(x.figma)+'" target="_blan
