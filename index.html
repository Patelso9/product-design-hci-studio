*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,sans-serif}.shell{display:flex;min-height:100vh}.side{width:245px;background:var(--green);color:#fff;padding:30px 20px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column}.brand{font:25px Georgia,serif}.sub{font-size:12px;color:#c7d4ce}.nav{margin-top:40px;display:grid;gap:6px}.nav button{background:none;border:0;color:#dbe5df;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--green2);color:#fff}.nav-spacer{flex:1}.work-btn{width:205px}.timer{width:205px;margin:0 0 6px;font-size:12px;color:#dbe5df}.main{margin-left:245px;width:calc(100% - 245px);padding:42px clamp(25px,5vw,75px);max-width:1250px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--gold);font-weight:700}.hero h1,h1,h2,h3{font-family:Georgia,serif;font-weight:400}.hero h1{font-size:44px;line-height:1.08;margin:8px 0 14px}.hero p{max-width:760px;color:var(--muted);font-size:17px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}.stat b{display:block;font:28px Georgia,serif}.stat span,.small{color:var(--muted);font-size:12px}.card{margin:16px 0}.card h2{margin:0 0 10px;font-size:24px}.card h3{margin:0 0 6px;font-size:18px}.pill{display:inline-block;background:var(--sage);padding:4px 9px;border-radius:99px;font-size:12px;margin:3px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.q{background:var(--soft);border-left:3px solid var(--gold);padding:14px 16px;margin:14px 0}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}input,textarea,select{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);font:inherit}textarea{min-height:110px;resize:vertical}.btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:8px;padding:9px 14px;cursor:pointer}.btn.secondary{background:transparent;color:var(--green)}.btn:disabled{opacity:.45;cursor:not-allowed}.task{border-top:1px solid var(--line)}.task:first-child{border-top:0}.task summary{list-style:none;cursor:pointer;padding:16px 4px;display:flex;align-items:center;gap:12px}.task summary::-webkit-details-marker{display:none}.task summary:before{content:'＋';font-size:18px;color:var(--gold);width:18px}.task[open] summary:before{content:'−'}.task-title{flex:1;font-family:Georgia,serif;font-size:18px}.task-check{width:20px;height:20px;accent-color:var(--green);margin:0}.task-body{padding:0 36px 18px}.task-body .q{margin-top:0}.task.done .task-title{text-decoration:line-through;color:var(--muted)}.task-status{font-size:11px;color:var(--muted);margin-left:auto}.unit-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.checkpoint{border:1px solid var(--gold);background:#fcf8ee}.checkpoint h2{margin-bottom:6px}.phase-list{display:grid;gap:10px}.phase-row{border-top:1px solid var(--line);padding:16px 0;display:grid;grid-template-columns:45px 1fr auto;gap:14px;align-items:center}.phase-row:first-child{border-top:0}.phase-num{font:22px Georgia,serif;color:var(--gold)}.linkline{margin:10px 0}.term-card,.book{border-top:1px solid var(--line);padding:18px 0}.term-card:first-child,.book:first-child{border-top:0}.term-card h3{margin:0}.book summary{cursor:pointer;font:18px Georgia,serif}.schedule-table{width:100%;border-collapse:collapse}.schedule-table th,.schedule-table td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}.schedule-table th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.complete{color:var(--green);font-weight:700}.todo{color:var(--muted)}.progress{height:6px;background:#e5dfd3;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}.obs{border-top:1px solid var(--line);padding:18px 0}.obs:first-of-type{border-top:0}.obs strong{font:18px Georgia,serif}.section-rule{margin:34px 0;border:0;border-top:1px solid var(--line)}.muted-box{background:#f8f5ed;padding:14px 16px;border-radius:8px}.mini-list{margin:8px 0 0;padding-left:20px}@media(max-width:800px){.side{position:static;width:100%;height:auto}.shell{display:block}.main{margin:0;width:100%;padding:28px 18px}.nav{display:flex;overflow:auto;margin-top:20px}.nav button{white-space:nowrap}.grid{grid-template-columns:1fr}.hero h1{font-size:36px}.unit-head{flex-direction:column}.phase-row{grid-template-columns:35px 1fr}.phase-row .btn{grid-column:2}.schedule-table{font-size:13px}.schedule-table th:nth-child(4),.schedule-table td:nth-child(4){display:none}}
</style></head><body>
<div class="shell"><aside class="side"><div class="brand">HCI Studio</div><div class="sub">Product Design + HCI</div><nav class="nav" id="nav"></nav><div class="nav-spacer"></div><div id="timer" class="timer"></div><button class="btn work-btn" id="workBtn" onclick="toggleTimer()">Start work</button></aside><main class="main" id="app"></main></div>
<script>
var KEY="pdHciStudio";
var phases=[
{name:"HCI + Human Behavior",weeks:"5–6 weeks",goal:"Learn to see human behavior before trying to design solutions.",units:[
["HCI Foundations","How do people actually interact with the world around them?"],
["Mental Models","What does a person believe is happening when they use something?"],
["Affordances, Signifiers & Discoverability","How does an interface communicate what I can do?"],
["Feedback, Mapping & Constraints","How does a system communicate what just happened and what I can do next?"],
["Cognition, Attention & Decision Making","How do human cognitive limitations affect design?"],
["Inclusive & Ethical Design","Who might struggle with this experience, and why?"]
]},
{name:"UX Research",weeks:"7–8 weeks",goal:"Learn to investigate problems rather than assume them.",units:[
["Research Foundations","What do I need to learn, and which evidence would actually help?"],
["Research Planning","How do I turn uncertainty into a focused research plan?"],
["Interviews","How can I learn about behavior without leading the person?"],
["Contextual Inquiry & Observation","What changes when I study behavior in context?"],
["Surveys & Quantitative Research","When is quantitative evidence useful, and how can I avoid misleading questions?"],
["Research Analysis","How do I move from raw observations to patterns and evidence?"],
["Insights & Opportunity Areas","How do findings become insights, implications, and opportunities?"],
["Research Project","Can I investigate a real problem from question to research readout?"]
]},
{name:"Information Architecture",weeks:"5–6 weeks",goal:"Learn to organize complexity around human needs.",units:[
["IA Foundations","How should information be structured so people can understand and navigate it?"],
["Hierarchy, Organization & Taxonomy","How do grouping and hierarchy shape findability?"],
["Navigation & Wayfinding","How do people know where they are, where they can go, and how to get back?"],
["Labels, Search, Filtering & Sorting","How do language and retrieval patterns help people find what they need?"],
["Content Models & Progressive Disclosure","What information belongs together, and when should complexity be revealed?"],
["Card Sorting, Tree Testing & IA Project","Can I validate an information structure rather than designing it from intuition?"]
]},
{name:"Interaction Design",weeks:"7–8 weeks",goal:"Turn understanding and structure into usable behavior.",units:[
["Interaction Foundations","How do goals, actions, states, and system responses form an interaction?"],
["Controls & Interaction Patterns","When should I use menus, tabs, selection, dialogs, or other established patterns?"],
["Forms & Input","How can interfaces make input clear, efficient, and forgiving?"],
["Feedback, Errors & Recovery","How should a product respond when things go wrong?"],
["States & Edge Cases","What happens during loading, empty, offline, disabled, partial, success, and failure states?"],
["Mobile, Responsive & Touch","How does interaction change across devices and contexts?"],
["Complex Workflows","How do I design a multi-step experience without losing the user's mental model?"],
["Interaction Project","Can I design and specify one complete workflow from happy path through edge cases?"]
]},
{name:"Product Design + Evaluation",weeks:"6–7 weeks",goal:"Move from designing experiences to making product decisions.",units:[
["Usability Testing","How can I observe whether a design actually works for people?"],
["Synthesis, Severity & Iteration","How do I decide what findings matter and what to change?"],
["Product Thinking","How do user needs, business needs, technical constraints, and product goals interact?"],
["MVP, Prioritization & Tradeoffs","What should be built now, later, or not at all?"],
["Metrics & Success Criteria","How will I know whether the experience is successful?"],
["Product Discovery & Collaboration","How do UX, product, engineering, and stakeholders make decisions together?"],
["Evaluation Project","Can I research, prototype, test, redesign, and explain the product decisions I made?"]
]},
{name:"Capstone + Portfolio",weeks:"8–10 weeks",goal:"Synthesize the entire process into substantial portfolio work.",units:[
["Problem Selection","Choose a meaningful problem worth investigating."],
["Research","Build evidence before committing to a solution."],
["Synthesis & Definition","Turn research into a clear problem, insight, and opportunity."],
["IA","Create and validate the information structure."],
["Concept & Interaction","Design the behavior and experience."],
["Visual Design","Develop a coherent, accessible interface system."],
["Prototype, Evaluation & Iteration","Test the work, learn from evidence, and improve it."],
["Product Thinking","Define MVP, metrics, constraints, tradeoffs, and a realistic path forward."],
["Case Study","Tell the story from problem through decisions, evidence, and outcome."]
]}
];
var booksDefault=[
{title:"The Design of Everyday Things",author:"Don Norman",weeks:[1,2,3,4,5,6],notes:"",annotations:[]},
{title:"About Face",author:"Alan Cooper et al.",weeks:[21,22,23,24,25,26,27,28],notes:"",annotations:[]},
{title:"Don’t Make Me Think",author:"Steve Krug",weeks:[15,17,22,23],notes:"",annotations:[]},
{title:"Just Enough Research",author:"Erika Hall",weeks:[7,8,9,10,11,12,13,14],notes:"",annotations:[]},
{title:"Information Architecture",author:"Louis Rosenfeld, Peter Morville, Jorge Arango",weeks:[15,16,17,18,19,20],notes:"",annotations:[]},
{title:"100 Things Every Designer Needs to Know About People",author:"Susan Weinschenk",weeks:[2,5,21,29],notes:"",annotations:[]}
];
var unitData=[
{learn:["HCI","Human-centered design","Observation vs assumption","People, technology, context","Human limitations"],evidence:"Observation portfolio",case:"Door problem from The Design of Everyday Things; Apple Calendar; one poorly designed everyday object.",apply:"Analyze 10 everyday objects or experiences without redesigning them.",checkpoint:"Demonstrate that you can observe and explain interaction without immediately jumping to solutions."},
{learn:["Mental models","Conceptual models","System models","Mismatch"],evidence:"Mental-model analysis",case:"Thermostats; car gear selectors; Apple/iOS Settings.",apply:"Map user mental model vs system model for 3 products.",checkpoint:"Explain where a product's model matches or conflicts with a user's expectation."},
{learn:["Affordances","Perceived affordances","Signifiers","Discoverability","Visibility"],evidence:"Affordance/signifier analysis",case:"Door handles; iOS gestures; Airbnb interaction patterns.",apply:"Analyze 5 interfaces for action discoverability.",checkpoint:"Explain how an interface communicates possible actions without relying on instructions."},
{learn:["Feedback","Mapping","Constraints","Natural mapping","System status"],evidence:"Feedback analysis",case:"Microwave controls; elevator controls; undo/redo; form validation.",apply:"Analyze interaction feedback in 5 products.",checkpoint:"Explain whether the system makes actions, results, and next steps clear."},
{learn:["Cognitive load","Recognition vs recall","Attention","Memory","Hick's Law","Fitts's Law","Decision-making"],evidence:"Cognitive-load audit",case:"Google Search; Apple interfaces; checkout flows; ATM interfaces.",apply:"Audit one product for cognitive load and decision friction.",checkpoint:"Identify concrete ways cognitive limitations shape an interface."},
{learn:["Inclusive design","Accessibility","WCAG foundations","Cognitive accessibility","Bias","Edge cases","Ethics"],evidence:"Accessibility audit",case:"Accessibility successes and failures; inclusive physical design; accessible digital forms.",apply:"Audit an existing product for accessibility and edge cases.",checkpoint:"Identify who may be excluded by a design and explain what the design can do differently."}
];
var researchData=[
["Research Foundations",["Qualitative vs quantitative","Generative vs evaluative","Research questions","Assumptions","Method selection"],"Research method comparison","Given a product problem, explain what you need to learn, why, and which method would give useful evidence."],
["Research Planning",["Objectives","Methods","Participants","Recruitment","Ethics"],"Research plan","Create a focused research plan that connects questions, methods, participants, and ethics."],
["Interviews",["Interview structure","Probing","Neutral questions","Behavioral interviewing","Bias"],"Interview guide","Write and conduct an interview without leading the participant."],
["Contextual Inquiry & Observation",["Context","Environment","Workarounds","Behavior vs stated preference"],"Contextual observation","Observe behavior in context and separate what people do from what they say they do."],
["Surveys & Quantitative Research",["Survey design","Question bias","Sample-size basics","Quantitative vs qualitative evidence"],"Survey critique","Explain when a survey is appropriate and identify bias in survey questions."],
["Research Analysis",["Affinity mapping","Coding","Themes","Patterns","Evidence"],"Affinity map + coding exercise","Move from raw notes to defensible patterns without inventing conclusions."],
["Insights & Opportunity Areas",["Observation → Finding → Insight → Design implication"],"Research synthesis","Translate evidence into insights, implications, and opportunity areas."],
["Research Project",["Research plan","Interview guide","Notes","Affinity map","Findings","Behavioral patterns","Journey map","Problem statement","Opportunity areas","Research readout"],"Full research project","Investigate how people manage things they need to remember, buy, research, complete, return, or plan around their home/life."],
];
var iaData=[
["IA Foundations",["Hierarchy","Organization","Classification","Taxonomy"],"IA reverse-engineering","Explain how structure supports user goals."],
["Hierarchy, Organization & Taxonomy",["Grouping","Hierarchy","Content types","User goals"],"Hierarchy model","Create a content hierarchy and justify the grouping logic."],
["Navigation & Wayfinding",["Global/local navigation","Wayfinding","Orientation","Primary/secondary navigation"],"Navigation model","Explain how users know where they are, where they can go, and how to return."],
["Labels, Search, Filtering & Sorting",["Labels","Language","Search","Filters","Sorting"],"Label and retrieval audit","Improve labels and retrieval patterns using user language and task intent."],
["Content Models & Progressive Disclosure",["Content models","Relationships","Progressive disclosure"],"Content model","Define what information belongs together and what complexity should be revealed when."],
["Card Sorting, Tree Testing & IA Project",["Card sorting","Tree testing","Validation"],"IA package","Create and validate a Vazhi content inventory, taxonomy, sitemap, navigation model, and key flows."],
];
var interactionData=[
["Interaction Foundations",["Goals","Actions","States","System response"],"Interaction model","Describe a complete interaction as goal → action → system response → next decision."],
["Controls & Interaction Patterns",["Menus","Tabs","Selection","Controls","Dialogs"],"Pattern analysis","Choose established patterns based on user goals and context."],
["Forms & Input",["Input","Defaults","Validation","Error prevention"],"Form critique","Design input that is clear, efficient, and forgiving."],
["Feedback, Errors & Recovery",["Errors","Recovery","Undo","Destructive actions"],"Error/recovery flow","Design failure and recovery paths rather than only the happy path."],
["States & Edge Cases",["Empty","Loading","Success","Failure","Offline","Disabled","Partial"],"State inventory","Specify meaningful states for a real product workflow."],
["Mobile, Responsive & Touch",["Mobile","Responsive behavior","Touch targets","Gestures"],"Responsive analysis","Explain how an interaction changes across devices and viewport sizes."],
["Complex Workflows",["Multi-step flows","Progressive disclosure","Edge cases"],"Workflow map","Design a complex workflow without losing the user's mental model."],
["Interaction Project",["Research → Create → Compare → Decide → Complete/Return"],"Interactive prototype + specification","Design one complete Vazhi workflow from happy path through edge cases."],
];
var productData=[
["Usability Testing",["Task design","Moderation","Observation","Success criteria"],"Usability test plan","Test a prototype with 5 users and observe without helping."],
["Synthesis, Severity & Iteration",["Severity","Frequency","Patterns","Evidence","Iteration"],"Test findings","Prioritize findings using evidence rather than personal preference."],
["Product Thinking",["User needs","Business needs","Technical constraints","Product goals"],"Product decision brief","Explain a design decision in terms of user, business, and technical context."],
["MVP, Prioritization & Tradeoffs",["MVP","Prioritization","Tradeoffs"],"Prioritization exercise","Decide what belongs now, later, or not at all and explain the tradeoff."],
["Metrics & Success Criteria",["Metrics","Success criteria","Behavioral signals"],"Success criteria","Define measurable signals for whether an experience is working."],
["Product Discovery & Collaboration",["Opportunity discovery","Experimentation","Stakeholder alignment","UX + Dev + PM collaboration"],"Discovery brief","Frame a product decision collaboratively and identify what remains uncertain."],
["Evaluation Project",["Research","Prototype","Test","Findings","Redesign"],"Evaluated product","Research → prototype → test → findings → redesign and explain the decisions."],
];
var capstoneData=[
["Problem Selection","Problem brief","Choose a meaningful problem worth investigating."],
["Research","Research package","Build evidence before committing to a solution."],
["Synthesis & Definition","Insight + opportunity package","Turn research into a clear problem, insight, and opportunity."],
["IA","IA package","Create and validate the information structure."],
["Concept & Interaction","Interaction concept","Design the behavior and experience."],
["Visual Design","Accessible visual system","Develop a coherent, accessible interface system."],
["Prototype, Evaluation & Iteration","Test + iteration package","Test the work, learn from evidence, and improve it."],
["Product Thinking","Product decision brief","Define MVP, metrics, constraints, tradeoffs, and a realistic path forward."],
["Case Study","Portfolio case study","Tell the story from problem through decisions, evidence, and outcome."]
];
var weekMap=[];phases.forEach(function(p,pi){p.units.forEach(function(u,ui){weekMap.push({week:weekMap.length+1,phase:pi+1,unit:ui+1,title:u[0],question:u[1],phaseName:p.name})})});
var DEFAULT={week:1,tasks:{},taskData:{},concepts:[],observations:[],reflection:"",evidence:[],weekCompleted:{},books:booksDefault,timer:{running:false,startedAt:0,total:0},interfaceLogs:[]};
var state;try{state=JSON.parse(localStorage.getItem(KEY)||"null")||DEFAULT}catch(e){state=DEFAULT}
state.tasks=state.tasks||{};state.taskData=state.taskData||{};state.concepts=state.concepts||[];state.observations=state.observations||[];state.evidence=state.evidence||[];state.weekCompleted=state.weekCompleted||{};state.books=state.books&&state.books.length?state.books:booksDefault;state.timer=state.timer||DEFAULT.timer;state.interfaceLogs=state.interfaceLogs||[];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[m]})}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function go(p){page=p;nav();render()}
var page="dashboard";
function nav(){var items=[["dashboard","Dashboard"],["syllabus","Syllabus"],["curriculum","Curriculum"],["library","Design School Library"],["interface","Interface Practice"],["books","Books"]];document.getElementById("nav").innerHTML=items.map(function(x){return '<button class="'+(page===x[0]?"active":"")+'" onclick="go(\''+x[0]+'\')">'+x[1]+"</button>"}).join("")}
function current(){return weekMap[state.week-1]||weekMap[0]}
function phase(){return phases[current().phase-1]}
function checkpointFor(w){var d;if(w<=6)d=unitData[w-1];else if(w<=14)d=researchData[w-7];else if(w<=20)d=iaData[w-15];else if(w<=28)d=interactionData[w-21];else if(w<=35)d=productData[w-29];else d=capstoneData[w-36];return d}
function taskList(w){var c=checkpointFor(w),base=[];if(w<=6){base=[["learn","Learn","Read/watch the assigned material and capture the core ideas."],["capture","Capture","Add the important concepts to Design School Library in your own words."],["case","Case Study","Study the assigned real product or design case and connect it to the unit."],["apply","Apply","Complete the applied exercise for this learning unit."],["reflect","Reflect","Record what changed in your thinking."]]}else{base=[["learn","Learn","Complete the core learning and capture the ideas, examples, and questions that matter."],["case","Case Study","Study a real product/team case and identify the relevant design or HCI reasoning."],["apply","Apply","Complete the applied exercise and produce the expected evidence."],["critique","Critique","Examine the quality of your work, assumptions, tradeoffs, and edge cases."],["reflect","Reflect","Record what changed in your thinking and what you would do differently."]]}return base.map(function(x){return{id:x[0],title:x[1],prompt:x[2]}})}
function requiredDone(w){return taskList(w).filter(function(t){return state.tasks[w+"-"+t.id]}).length}
function toggleTask(k,checked){state.tasks[k]=checked;localStorage.setItem(KEY,JSON.stringify(state));render()}
function taskRows(w){return taskList(w).map(function(t,i){var k=w+"-"+t.id,done=!!state.tasks[k];return '<div class="task '+(done?"done":"")+'"><label style="display:flex;align-items:center;gap:12px;padding:15px 4px;cursor:pointer"><input class="task-check" type="checkbox" '+(done?"checked":"")+' onchange="toggleTask(\''+k+'\',this.checked)"><span class="task-title">'+(i+1)+'. '+esc(t.title)+'</span><span class="task-status">'+(done?"Complete":"Open")+'</span></label><div class="task-body"><div class="small">'+esc(t.prompt)+'</div></div></div>'}).join("")}
function dashboard(){var c=current(),p=phase(),done=requiredDone(c.week),cp=checkpointFor(c.week);return '<section class="hero"><div class="eyebrow">Personal learning + evidence studio</div><h1>Learn. Observe. Apply. Reflect.</h1><p>One focused place to know what you are learning now, what you need to produce, and what practice keeps your design judgment growing.</p></section><div class="card"><div class="eyebrow">Current learning unit</div><div class="unit-head"><div><h2>'+esc(c.title)+'</h2><p>'+esc(c.question)+'</p><span class="pill">Phase '+c.phase+' · '+esc(c.phaseName)+'</span><span class="pill">Suggested pace · ~1 week</span></div><button class="btn" onclick="go(\'curriculum\')">Open curriculum</button></div></div><div class="grid"><div class="stat"><b>'+done+'/'+taskList(c.week).length+'</b><span>Core tasks complete</span></div><div class="stat"><b>'+Object.keys(state.weekCompleted).length+'</b><span>Checkpoints completed</span></div><div class="stat"><b>'+state.concepts.length+'</b><span>Concepts captured</span></div></div><div class="card"><div class="eyebrow">This week</div><h2>Core learning</h2>'+taskRows(c.week)+'</div><div class="card"><div class="eyebrow">Weekly practice</div><h2>Keep the design muscle active</h2><div class="task"><label style="display:flex;align-items:center;gap:12px;padding:15px 4px;cursor:pointer"><input class="task-check" type="checkbox" '+(weeklyPracticeDone()?"checked":"")+' onchange="toggleWeeklyPractice(this.checked)"><span class="task-title">Interface Practice</span><span class="task-status">'+(weeklyPracticeDone()?"Complete":"Open")+'</span></label></div><div class="task"><label style="display:flex;align-items:center;gap:12px;padding:15px 4px;cursor:pointer"><input class="task-check" type="checkbox" '+(accessReviewDone()?"checked":"")+' onchange="toggleAccess(this.checked)"><span class="task-title">Accessibility Review</span><span class="task-status">'+(accessReviewDone()?"Complete":"Open")+'</span></label></div><p class="small">These practices support the curriculum but do not block a checkpoint.</p></div><div class="card checkpoint"><div class="eyebrow">Checkpoint</div><h2>'+esc(cp[cp.length-1])+'</h2><p class="small">Expected evidence: '+esc(cp[cp.length-2])+'</p><button class="btn secondary" onclick="go(\'curriculum\')">View checkpoint</button></div><div class="card"><div class="eyebrow">Next</div><h2>'+((c.week<44)?esc(weekMap[c.week].title):"Capstone complete")+'</h2><p class="small">'+((c.week<44)?esc(weekMap[c.week].question):"You have reached the end of the recommended learning journey.")+'</p></div>'}
var weeklyState={practice:{},access:{}};
function weekKey(){return "w"+state.week}
function weeklyPracticeDone(){return !!(state.weekly&&state.weekly[weekKey()]&&state.weekly[weekKey()].practice)}
function accessReviewDone(){return !!(state.weekly&&state.weekly[weekKey()]&&state.weekly[weekKey()].access)}
function setWeekly(k,v){state.weekly=state.weekly||{};state.weekly[weekKey()]=state.weekly[weekKey()]||{};state.weekly[weekKey()][k]=v;localStorage.setItem(KEY,JSON.stringify(state));render()}
function toggleWeeklyPractice(v){setWeekly("practice",v)}
function toggleAccess(v){setWeekly("access",v)}
function syllabus(){return '<div class="eyebrow">The syllabus</div><h1>Product Design + HCI Studio</h1><p class="hero">A 9–12 month, checkpoint-based curriculum for building formal-level HCI knowledge, research capability, interaction and visual design judgment, product thinking, and technical fluency.</p><div class="grid"><div class="stat"><b>HCI</b><span>Understand people.</span></div><div class="stat"><b>Design</b><span>Turn understanding into experiences.</span></div><div class="stat"><b>Product</b><span>Make experiences useful, feasible, and valuable.</span></div></div><div class="card"><div class="eyebrow">The outcome</div><h2>What you are building toward</h2><div class="q">“I can understand a problem, research it, make sense of complex information, define an experience, design and prototype a solution, evaluate it with users, work with engineers and PMs, and explain why I made the decisions I made.”</div><p class="small">The goal is not to memorize UX vocabulary. It is to build the reasoning, practice, and evidence to support that statement.</p></div><div class="card"><div class="eyebrow">Learning model</div><h2>Learn → Capture → Observe → Apply → Critique → Reflect → Evidence</h2><p>Learning units are the actual coursework. Checkpoints determine progression. Weekly check-ins create rhythm and accountability. Evidence is the proof of applied learning.</p><div class="muted-box"><strong>Suggested pace:</strong> ~5–7 hours/week. The 44-week timeline is a recommended pacing estimate, not a rigid deadline.</div></div><div class="card"><div class="eyebrow">The journey</div><div class="phase-list">'+phases.map(function(p,i){return '<div class="phase-row"><div class="phase-num">'+(i+1)+'</div><div><h3>'+esc(p.name)+'</h3><div class="small">'+esc(p.goal)+'</div></div><span class="pill">'+p.weeks+'</span></div>'}).join("")+'</div></div><div class="card"><div class="eyebrow">Parallel practice</div><h2>Design judgment grows alongside the coursework</h2><ul class="mini-list"><li><strong>Interface Practice:</strong> Analyze → Recreate → Explain, every week.</li><li><strong>Design School Library:</strong> Build a living reference of concepts, examples, counterexamples, and reasoning.</li><li><strong>Accessibility:</strong> Treat accessibility as part of design, not a final checklist.</li><li><strong>AI + UX:</strong> Study AI as a design tool and AI product design—trust, uncertainty, oversight, agents, failure, and evaluation.</li></ul></div><div class="card"><div class="eyebrow">Graduation criteria</div><h2>Leave with a body of evidence</h2><p>Complete substantial evidence across observation, research, IA, interaction design, evaluation, product decisions, and a capstone case study. The portfolio should show not only what you made, but how you reasoned.</p></div>'}
function curriculum(){var c=current(),p=phase(),cp=checkpointFor(c.week),next=weekMap[c.week];var learn=cp.slice(0,cp.length-2),expected=cp[cp.length-2],check=cp[cp.length-1];var h='<div class="eyebrow">Coursework</div><h1>Curriculum</h1><p class="hero">Move through learning units as your understanding develops. Weeks are a suggested rhythm; checkpoints are the progression mechanism.</p><div class="card"><div class="unit-head"><div><span class="pill">Phase '+c.phase+' · '+esc(c.phaseName)+'</span><span class="pill">Unit '+c.unit+' · Suggested week '+c.week+'</span><h2>'+esc(c.title)+'</h2><p>'+esc(c.question)+'</p></div><select style="max-width:280px" onchange="state.week=+this.value;save()">'+weekMap.map(function(x){return '<option value="'+x.week+'" '+(x.week===c.week?"selected":"")+'>'+x.week+' · '+esc(x.title)+'</option>'}).join("")+'</select></div></div><div class="grid"><div class="stat"><b>Understand</b><span>'+esc(learn.join(" · "))+'</span></div><div class="stat"><b>Show</b><span>'+esc(expected)+'</span></div><div class="stat"><b>Progress</b><span>'+requiredDone(c.week)+' of '+taskList(c.week).length+' core tasks</span></div></div><div class="card"><div class="eyebrow">Learning unit</div><h2>What to learn</h2><div class="row">'+learn.map(function(x){return '<span class="pill">'+esc(x)+'</span>'}).join("")+'</div><hr class="section-rule"><h2>Coursework</h2>'+taskRows(c.week)+'</div><div class="card"><div class="eyebrow">Case study</div><h2>Study design in the world</h2><p>'+esc(caseStudy(c.week))+'</p><p class="small">Ask: What problem was being addressed? What HCI/design principle is relevant? What information or interaction choices can you identify? What assumptions does the design make? What happens in edge cases? What can I learn from it?</p></div><div class="card checkpoint"><div class="eyebrow">Checkpoint</div><h2>'+esc(check)+'</h2><p><strong>Evidence:</strong> '+esc(expected)+'</p><p class="small">Checkpoint completion should mean you can demonstrate the skill, not simply say that you studied it.</p><button class="btn" onclick="completeCheckpoint()">'+(state.weekCompleted[c.week]?"Completed · "+formatDate(new Date(state.weekCompleted[c.week])):"Complete checkpoint")+'</button></div>'+((next)?'<div class="card"><div class="eyebrow">Next learning unit</div><h2>'+esc(next.title)+'</h2><p>'+esc(next.question)+'</p></div>':"");return h}
function caseStudy(w){if(w<=6)return unitData[w-1].case;if(w<=14)return ["A product team framing a research question","Product teams using observation to uncover workarounds","A user interview methodology example","Workplace, healthcare, or retail/service observation","A product decision informed by behavioral data","Turning raw research into findings","A research-driven product change","A full research readout"][w-7];if(w<=20)return ["Apple Calendar, Notion, and Airbnb","Notion and complex content organization","Apple and Airbnb navigation","Amazon, Spotify, Shopify, and government/banking search","Notion and progressive disclosure","A validated IA redesign"][w-15];if(w<=28)return ["iOS interaction foundations","Established mobile interaction patterns","Checkout and onboarding forms","Google Drive, Slack, and destructive actions","Real products across loading/empty/offline states","Responsive mobile experiences","Complex workflows in Notion or Airbnb","A complete end-to-end workflow"][w-21];if(w<=35)return ["Usability studies that changed a product","Product redesign after research findings","A real product tradeoff","MVP prioritization case","A product using behavioral metrics","Cross-functional product discovery","Research → prototype → test → redesign"][w-29];return "Choose a real product or comparable experience that gives you a useful reference point for the stage of your capstone."}
function completeCheckpoint(){var w=state.week;if(requiredDone(w)<taskList(w).length){alert("Complete the core coursework items first. The checkbox only becomes meaningful when the work is actually done.");return}state.weekCompleted[w]=new Date().toISOString();if(w<44)state.week=w+1;save();page="dashboard";nav();render()}
function formatDate(d){return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function library(){var h='<div class="eyebrow">Personal knowledge base</div><h1>Design School Library</h1><p class="hero">A living reference of HCI and design reasoning. Capture concepts in your own words, connect them to examples and coursework, and return to them later.</p><div class="card"><h2>Core Week 1 concepts</h2>';var terms=unitData[0].learn.concat(["Mental model","Affordance","Signifier","Feedback","Mapping","Constraint","Discoverability","Error","Recognition vs recall"]);terms.forEach(function(t,i){var f=state.concepts.filter(function(c){return c.term===t})[0]||{};h+='<div class="term-card"><h3>'+esc(t)+'</h3><div class="field"><label>Definition</label><textarea id="ld'+i+'">'+esc(f.definition||"")+'</textarea></div><div class="field"><label>My understanding</label><textarea id="lu'+i+'">'+esc(f.understanding||"")+'</textarea></div><div class="field"><label>Example / where I saw it</label><textarea id="le'+i+'">'+esc(f.example||"")+'</textarea></div><div class="field"><label>Why it works / counterexample</label><textarea id="ly'+i+'">'+esc(f.why||"")+'</textarea></div><div class="field"><label>Where I applied it / question</label><textarea id="la'+i+'">'+esc(f.application||"")+'</textarea></div><button class="btn secondary" onclick="saveLibraryConcept('+i+',\''+esc(t)+'\')">Save concept</button></div>'});h+='</div><div class="card"><h2>Add a concept</h2><div class="field"><label>Concept</label><input id="newConcept"></div><div class="field"><label>Definition</label><textarea id="newDefinition"></textarea></div><div class="field"><label>My understanding</label><textarea id="newUnderstanding"></textarea></div><div class="field"><label>Example / where I saw it</label><textarea id="newExample"></textarea></div><div class="field"><label>Curriculum connection</label><select id="newConnection">'+weekMap.map(function(x){return '<option value="'+x.week+'">'+x.week+' · '+esc(x.title)+'</option>'}).join("")+'</select></div><button class="btn" onclick="addLibraryConcept()">Add concept</button></div>';return h}
function saveLibraryConcept(i,t){var f=state.concepts.filter(function(c){return c.term===t})[0];if(!f){f={term:t};state.concepts.push(f)}f.definition=document.getElementById("ld"+i).value;f.understanding=document.getElementById("lu"+i).value;f.example=document.getElementById("le"+i).value;f.why=document.getElementById("ly"+i).value;f.application=document.getElementById("la"+i).value;localStorage.setItem(KEY,JSON.stringify(state))}
function addLibraryConcept(){var t=document.getElementById("newConcept").value.trim();if(!t)return;state.concepts.push({term:t,definition:document.getElementById("newDefinition").value,understanding:document.getElementById("newUnderstanding").value,example:document.getElementById("newExample").value,week:+document.getElementById("newConnection").value});save()}
function interfacePractice(){var h='<div class="eyebrow">Weekly design judgment</div><h1>Interface Practice</h1><p class="hero">Analyze → Recreate → Explain. Spend about 30 minutes studying one excellent interface closely. This practice supports the curriculum but does not gate checkpoint completion.</p><div class="card"><h2>New practice log</h2><div class="field"><label>Product / interface</label><input id="ipProduct"></div><div class="field"><label>What I analyzed</label><textarea id="ipAnalyze" placeholder="What stood out?"></textarea></div><div class="grid"><div class="field"><label>Typography</label><textarea id="ipType"></textarea></div><div class="field"><label>Spacing / hierarchy</label><textarea id="ipSpace"></textarea></div><div class="field"><label>Color</label><textarea id="ipColor"></textarea></div><div class="field"><label>Interaction</label><textarea id="ipInteraction"></textarea></div><div class="field"><label>Density / components</label><textarea id="ipDensity"></textarea></div><div class="field"><label>Responsive behavior</label><textarea id="ipResponsive"></textarea></div></div><div class="field"><label>What I recreated</label><textarea id="ipRecreated"></textarea></div><div class="field"><label>What I learned</label><textarea id="ipLearned"></textarea></div><button class="btn" onclick="addInterfaceLog()">Save practice</button></div><div class="card"><h2>Practice history</h2>'+state.interfaceLogs.map(function(x){return '<div class="term-card"><h3>'+esc(x.product)+'</h3><div class="small">'+esc(x.date||"")+'</div><p>'+esc(x.learned)+'</p></div>'}).join("")+'</div>'}
function addInterfaceLog(){state.interfaceLogs.unshift({product:document.getElementById("ipProduct").value,analyze:document.getElementById("ipAnalyze").value,type:document.getElementById("ipType").value,space:document.getElementById("ipSpace").value,color:document.getElementById("ipColor").value,interaction:document.getElementById("ipInteraction").value,density:document.getElementById("ipDensity").value,responsive:document.getElementById("ipResponsive").value,recreated:document.getElementById("ipRecreated").value,learned:document.getElementById("ipLearned").value,date:formatDate(new Date())});setWeekly("practice",true)}
function books(){var h='<div class="eyebrow">Reading + annotation</div><h1>Books</h1><p class="hero">Core reading that supports the learning journey. Keep notes and annotations connected to the learning units where you use them.</p><div class="card"><h2>Core reading</h2>';state.books.forEach(function(b,bi){h+='<details class="book" '+(bi===0?"open":"")+'><summary>'+esc(b.title)+' · '+esc(b.author)+'</summary><div class="field"><label>Connected learning units</label><input value="'+esc((b.weeks||[]).join(", "))+'" onchange="updateBookWeeks('+bi+',this.value)"></div><div class="field"><label>Notes / takeaways</label><textarea onchange="updateBook('+bi+',this.value)">'+esc(b.notes||"")+'</textarea></div><h3>Annotations</h3>'+(b.annotations||[]).map(function(a){return '<div class="q"><strong>Unit '+esc(a.week||"")+'</strong><p>'+esc(a.text)+'</p></div>'}).join("")+'<div class="field"><label>Learning unit</label><select id="annW'+bi+'">'+weekMap.map(function(x){return '<option value="'+x.week+'">'+x.week+' · '+esc(x.title)+'</option>'}).join("")+'</select></div><div class="field"><label>Annotation</label><textarea id="annT'+bi+'"></textarea></div><button class="btn secondary" onclick="addAnnotation('+bi+')">Save annotation</button></details>'});h+='</div><div class="card"><h2>Add a book</h2><div class="field"><label>Title</label><input id="bookTitle"></div><div class="field"><label>Author</label><input id="bookAuthor"></div><button class="btn" onclick="addBook()">Add book</button></div>';return h}
function updateBook(i,v){state.books[i].notes=v;localStorage.setItem(KEY,JSON.stringify(state))}
function updateBookWeeks(i,v){state.books[i].weeks=v.split(",").map(function(x){return +x.trim()}).filter(function(x){return x>=1&&x<=44});localStorage.setItem(KEY,JSON.stringify(state));render()}
function addAnnotation(i){var w=+document.getElementById("annW"+i).value,t=document.getElementById("annT"+i).value.trim();if(!t)return;state.books[i].annotations=state.books[i].annotations||[];state.books[i].annotations.push({week:w,text:t});save()}
function addBook(){var t=document.getElementById("bookTitle").value.trim();if(!t)return;state.books.push({title:t,author:document.getElementById("bookAuthor").value,weeks:[],notes:"",annotations:[]});save()}
function schedule(){return '<div class="eyebrow">Suggested pacing</div><h1>Curriculum</h1><p class="hero">There is no separate schedule to manage. The syllabus uses ~44 weeks as a pacing estimate; the Dashboard keeps the current learning unit visible and checkpoints record actual progression.</p><div class="card"><h2>Journey at a glance</h2>'+phases.map(function(p,i){var start=i===0?1:phases.slice(0,i).reduce(function(a,x){return a+x.units.length},1);return '<div class="phase-row"><div class="phase-num">'+(i+1)+'</div><div><h3>'+esc(p.name)+'</h3><div class="small">'+esc(p.goal)+'</div></div><span class="pill">'+p.weeks+' · units '+start+'–'+(start+p.units.length-1)+'</span></div>'}).join("")+'</div>'}
function toggleTimer(){if(state.timer.running){state.timer.total+=Date.now()-state.timer.startedAt;state.timer.running=false;state.timer.startedAt=0}else{state.timer.running=true;state.timer.startedAt=Date.now()}localStorage.setItem(KEY,JSON.stringify(state));updateTimer()}
function timerSeconds(){return Math.floor((state.timer.total+(state.timer.running?Date.now()-state.timer.startedAt:0))/1000)}
function updateTimer(){var sec=timerSeconds(),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60,el=document.getElementById("timer"),btn=document.getElementById("workBtn");if(el)el.textContent=(state.timer.running?"Working · ":"Time · ")+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(btn)btn.textContent=state.timer.running?"Stop work":"Start work"}
setInterval(updateTimer,1000);
function render(){var views={dashboard:dashboard,syllabus:syllabus,curriculum:curriculum,library:library,interface:interfacePractice,books:books};document.getElementById("app").innerHTML=views[page]()}
try{nav();render();updateTimer()}catch(e){document.getElementById("app").innerHTML='<div class="card"><h1>Studio could not load</h1><p>Your saved data has not been intentionally deleted.</p></div>';console.error(e)}
</script></body></html>
