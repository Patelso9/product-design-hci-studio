round:var(--soft);border-left:3px solid var(--gold);padding:14px 16px;margin:14px 0}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}input,textarea,select{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);font:inherit}textarea{min-height:110px;resize:vertical}.btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:8px;padding:9px 14px;cursor:pointer}.btn.secondary{background:transparent;color:var(--green)}.btn:disabled{opacity:.45;cursor:not-allowed}.weeknav{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:18px}.weeknav h1{margin:7px 0}.weekselect{width:auto;min-width:190px}.task{border-top:1px solid var(--line)}.task:first-child{border-top:0}.task summary{list-style:none;cursor:pointer;padding:16px 4px;display:flex;align-items:center;gap:12px}.task summary::-webkit-details-marker{display:none}.task summary:before{content:'＋';font-size:18px;color:var(--gold);width:18px}.task[open] summary:before{content:'−'}.task-title{flex:1;font-family:Georgia,serif;font-size:18px}.task-check{width:20px;height:20px;accent-color:var(--green);margin:0}.task-body{padding:0 36px 18px}.task-body .q{margin-top:0}.task.done .task-title{text-decoration:line-through;color:var(--muted)}.task-status{font-size:11px;color:var(--muted);margin-left:auto}.obs{border-top:1px solid var(--line);padding:18px 0}.obs:first-of-type{border-top:0}.obs strong{font:18px Georgia,serif}.term-card{border-top:1px solid var(--line);padding:18px 0}.term-card:first-of-type{border-top:0}.term-card h3{margin:0}.schedule-table{width:100%;border-collapse:collapse}.schedule-table th,.schedule-table td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}.schedule-table th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.complete{color:var(--green);font-weight:700}.todo{color:var(--muted)}.date-input{max-width:190px}.progress{height:6px;background:#e5dfd3;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}@media(max-width:800px){.side{position:static;width:100%;height:auto}.shell{display:block}.main{margin:0;width:100%;padding:28px 18px}.nav{display:flex;overflow:auto;margin-top:20px}.nav button{white-space:nowrap}.grid{grid-template-columns:1fr}.hero h1{font-size:36px}.weeknav{align-items:flex-start;flex-direction:column}.weekselect{width:100%}.schedule-table{font-size:13px}.schedule-table th:nth-child(4),.schedule-table td:nth-child(4){display:none}}

<div class="shell"><aside class="side"><div class="brand">HCI Studio</div><div class="sub">Product Design + HCI</div><nav class="nav" id="nav"></nav><div class="nav-spacer"></div><div id="timer" class="timer"></div><button class="btn work-btn" id="workBtn" onclick="toggleTimer()">Start work</button></aside><main class="main" id="app"></main></div>
<script>
var KEY="pdHciStudio";
var weeks=[
["HCI Foundations","How do people actually interact with the world around them, and what can designers learn from observing that interaction?"],
["Human Behavior & Limitations","How do attention, memory, perception, and motivation shape interaction?"],
["Mental Models","How do expectations form, and where do product models diverge from user models?"],
["Design Principles","How do affordances, signifiers, feedback, mapping, and constraints communicate action?"],
["HCI Synthesis","What patterns are you now able to see that you previously overlooked?"]
];
for(var wi=6;wi<=44;wi++)weeks.push(["Studio Week "+wi,"Continue building HCI, UX research, IA, interaction design, evaluation, and product thinking through applied practice."]);

var phaseNames=["HCI + Human Behavior","UX Research","Information Architecture","Interaction Design","Product Design + Evaluation","Capstone + Portfolio"];
var weekTasks={
1:[
{id:"read",title:"Read + actively annotate",prompt:"Read The Design of Everyday Things. Capture 3 moments where Norman describes a mismatch between what a person expects and what a product actually allows.",fields:[["moments","Your 3 moments","textarea"]]},
{id:"observe",title:"Observe 10 everyday interactions",prompt:"Observe before redesigning. For each object or experience, record what you were trying to do, what you expected, what the design communicated, what happened, where you hesitated or erred, and what this reveals about the human using it.",fields:[["observationSummary","What patterns did you notice across the 10 observations?","textarea"]]},
{id:"vocabulary",title:"Build your HCI vocabulary",prompt:"Work through the Week 1 terms in the Learning Library. For each, write your own understanding and connect it to something you observed.",fields:[["vocabularyNotes","Which concepts became clearer through observation? Give at least 3 examples.","textarea"]]},
{id:"apply",title:"Connect observation to HCI",prompt:"Choose one observation and explain what it reveals about the relationship between people, technology, and context.",fields:[["analysis","Your analysis","textarea"]]},
{id:"reflect",title:"Reflect",prompt:"Write: What did I notice this week that I would not have noticed before studying HCI?",fields:[["reflection","Your reflection","textarea"]]}
]};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
var DEFAULT_STATE={week:1,tasks:{},taskData:{},concepts:[],observations:[],reflection:"",notes:"",evidence:[],startDate:"",endDate:"",weekCompleted:{},books:[],timer:{running:false,startedAt:0,total:0}};
var state;
try{state=JSON.parse(localStorage.getItem(KEY)||"null")||DEFAULT_STATE}catch(e){state=DEFAULT_STATE;try{localStorage.removeItem(KEY)}catch(ignore){}}
state.taskData=state.taskData||{};state.concepts=state.concepts||[];state.observations=state.observations||[];state.evidence=state.evidence||[];state.weekCompleted=state.weekCompleted||{};state.books=state.books||[];state.interfaceLogs=state.interfaceLogs||[];state.timer=state.timer||{running:false,startedAt:0,total:0};
var page="dashboard";
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function go(p){page=p;nav();render()}
function nav(){var items=[["dashboard","Dashboard"],["syllabus","Syllabus"],["curriculum","Curriculum"],["library","Design School Library"],["interface","Interface Practice"],["books","Books"]];document.getElementById("nav").innerHTML=items.map(function(x){return '<button class="'+(page===x[0]?"active":"")+'" onclick="go(\''+x[0]+'\')">'+x[1]+"</button>"}).join("")}
function phaseFor(w){return w<=5?1:w<=13?2:w<=19?3:w<=27?4:w<=34?5:6}
function currentTasks(w){if(weekTasks[w])return weekTasks[w];return[
{id:"learn",title:"Learn the core material",prompt:"Complete the assigned learning for this week. Capture the ideas, examples, and questions that matter.",fields:[["learningNotes","What did you learn?","textarea"]]},
{id:"apply",title:"Apply it to a real product",prompt:"Use this week’s concept to analyze a real product or experience.",fields:[["application","What did you observe or apply?","textarea"]]},
{id:"capture",title:"Capture observations",prompt:"Record 3 useful observations, examples, or questions from your work.",fields:[["observations","Your 3 observations, examples, or questions","textarea"]]},
{id:"concept",title:"Add to your vocabulary",prompt:"Add at least one useful concept to the Learning Library and explain it in your own words.",fields:[["conceptNotes","What concept did you capture and why does it matter?","textarea"]]},
{id:"reflect",title:"Reflect",prompt:"What changed in your thinking this week?",fields:[["reflection","Your reflection","textarea"]]}
]}
function taskComplete(k,t){if(state.tasks[k])return true;var d=state.taskData[k]||{};return t.fields.every(function(f){return String(d[f[0]]||"").trim().length>0})}
function taskHtml(t,index,w){var k=w+"-"+t.id,d=state.taskData[k]||{},complete=taskComplete(k,t);var fields=t.fields.map(function(f){var tag=f[2]==="textarea"?'<textarea data-task="'+esc(k)+'" data-field="'+esc(f[0])+'" oninput="saveTaskField(this)">'+esc(d[f[0]])+"</textarea>":'<input data-task="'+esc(k)+'" data-field="'+esc(f[0])+'" value="'+esc(d[f[0]])+'" oninput="saveTaskField(this)">';return '<div class="field"><label>'+esc(f[1])+'</label>'+tag+"</div>"}).join("");var related=t.id==="read"?'<div class="linkline"><button class="btn secondary" onclick="go(\'books\')">Open Books</button></div>':(t.id==="vocabulary"?'<div class="linkline"><button class="btn secondary" onclick="go(\'library\')">Open Learning Library</button></div>':"");return '<details class="task" '+(complete?"":"open")+'><summary><span class="task-title">'+(index+1)+'. '+esc(t.title)+'</span><span class="task-status">'+(complete?"Complete":"In progress")+'</span><input class="task-check" type="checkbox" '+(state.tasks[k]?"checked":"")+' '+(complete?"":"disabled")+' onclick="event.stopPropagation();toggleTask(\''+esc(k)+'\',this.checked)"></summary><div class="task-body"><div class="q">'+esc(t.prompt)+'</div>'+related+fields+'</div></details>'}
function saveTaskField(el){var k=el.dataset.task;state.taskData[k]=state.taskData[k]||{};state.taskData[k][el.dataset.field]=el.value;localStorage.setItem(KEY,JSON.stringify(state));var t=currentTasks(state.week).filter(function(x){return state.week+"-"+x.id===k})[0];if(t){var status=taskComplete(k,t);var root=el.closest(".task");var s=root.querySelector(".task-status");if(s)s.textContent=status?"Complete":"In progress";var c=root.querySelector(".task-check");if(c)c.disabled=!status}}
function toggleTask(k,val){state.tasks[k]=val;save()}
function openWeek(i){state.week=i;go("curriculum")}
function completeWeek(){var w=state.week,tasks=currentTasks(w);if(!tasks.every(function(t){return taskComplete(w+"-"+t.id,t)})){alert("Finish the required prompts before completing this week.");return}state.weekCompleted[w]=new Date().toISOString();if(w<44)state.week=w+1;save();page="curriculum";nav();render()}
function weekCompletedLabel(w){return state.weekCompleted[w]?formatDate(new Date(state.weekCompleted[w])):""}
function toggleTimer(){if(state.timer.running){state.timer.total+=Date.now()-state.timer.startedAt;state.timer.running=false;state.timer.startedAt=0}else{state.timer.running=true;state.timer.startedAt=Date.now()}localStorage.setItem(KEY,JSON.stringify(state));updateTimer()}
function timerSeconds(){return Math.floor((state.timer.total+(state.timer.running?Date.now()-state.timer.startedAt:0))/1000)}
function updateTimer(){var sec=timerSeconds(),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;var el=document.getElementById("timer"),btn=document.getElementById("workBtn");if(el)el.textContent=(state.timer.running?"Working · ":"Today · ")+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(btn)btn.textContent=state.timer.running?"Stop work":"Start work"}
setInterval(updateTimer,1000)
function guide(){return '<div class="eyebrow">The Studio</div><h1>Product Design + HCI Studio</h1><p class="hero">A structured path toward formal-level HCI knowledge, strong interaction and visual design skills, research capability, product thinking, and enough technical fluency to work closely with engineers.</p><div class="grid"><div class="stat"><b>HCI</b><span>Understand people.</span></div><div class="stat"><b>Design</b><span>Turn understanding into experiences.</span></div><div class="stat"><b>Product</b><span>Make those experiences useful, feasible, and valuable.</span></div></div><div class="card"><div class="eyebrow">The outcome</div><h2>What this studio is building toward</h2><p>By the end, you should be able to walk into a Product or UX Design interview and comfortably say:</p><div class="q">“I can understand a problem, research it, make sense of complex information, define an experience, design and prototype a solution, evaluate it with users, work with engineers and PMs, and explain why I made the decisions I made.”</div><p class="small">The goal is not to memorize UX vocabulary. It is to build the reasoning, practice, and evidence to support that statement.</p></div><div class="card"><div class="eyebrow">The rhythm</div><h2>Learn → Apply → Critique → Reflect → Repeat</h2><p>Each week should move between learning concepts, applying them to real work, examining the quality of the result, and reflecting on what changed in your thinking.</p><div class="grid"><div class="stat"><b>1 hr</b><span>Learn — book, course, article, or lecture.</span></div><div class="stat"><b>1 hr</b><span>Analyze — study a real product or interface.</span></div><div class="stat"><b>2–3 hrs</b><span>Build — apply the concept to your current project.</span></div><div class="stat"><b>1 hr</b><span>Research / test / critique — depending on the phase.</span></div><div class="stat"><b>30 min</b><span>Reflect — capture what changed.</span></div></div></div><div class="card"><div class="eyebrow">Design School Notebook</div><h2>Your personal UX / HCI reference library</h2><p>Keep one living notebook alongside the Studio. Every week, turn what you learned into a piece of design reasoning rather than another completed lesson.</p><div class="grid"><div class="stat"><b>Concept</b><span>Progressive disclosure, mental models, feedback, etc.</span></div><div class="stat"><b>Definition</b><span>The formal definition.</span></div><div class="stat"><b>Your explanation</b><span>Explain it in your own words.</span></div><div class="stat"><b>Example</b><span>A screenshot or example from a real product.</span></div><div class="stat"><b>Why it works</b><span>Your analysis of the design.</span></div><div class="stat"><b>Counterexample</b><span>Something that handles the idea poorly.</span></div><div class="stat"><b>Application</b><span>How you could use the concept.</span></div><div class="stat"><b>Question</b><span>Something you still do not understand.</span></div></div><div class="q">Over time, this becomes your personal UX / HCI reference library — and eventually something more valuable than a list of certificates: a body of design reasoning.</div></div><div class="card"><div class="eyebrow">Weekly interface practice</div><h2>Study one excellent interface</h2><p>Spend 30 minutes analyzing it, then recreate a small portion. The goal is to develop visual and interaction judgment by looking closely at decisions other designers made.</p><div class="grid"><div class="stat"><b>Typography</b><span>Why this typeface?</span></div><div class="stat"><b>Spacing</b><span>Why this spacing and rhythm?</span></div><div class="stat"><b>Hierarchy</b><span>Why is information ordered this way?</span></div><div class="stat"><b>Color</b><span>Why this color and contrast?</span></div><div class="stat"><b>Interaction</b><span>Why this interaction pattern?</span></div><div class="stat"><b>Density</b><span>Why this amount of information?</span></div><div class="stat"><b>Components</b><span>Why this component?</span></div><div class="stat"><b>Responsive</b><span>What happens when the viewport changes?</span></div></div></div><div class="card"><div class="eyebrow">Accessibility is part of design</div><h2>Build accessibility into the work</h2><p>Accessibility is not a separate final checklist. Throughout the Studio, you will practice thinking about:</p><div class="row"><span class="pill">WCAG concepts</span><span class="pill">Keyboard navigation</span><span class="pill">Focus states</span><span class="pill">Color contrast</span><span class="pill">Screen readers</span><span class="pill">Semantic structure</span><span class="pill">Touch targets</span><span class="pill">Motion</span><span class="pill">Cognitive accessibility</span><span class="pill">Accessible forms</span><span class="pill">Error messaging</span></div><div class="q">The expectation is that you actually audit your own designs — not simply know the terminology.</div></div><div class="card"><div class="eyebrow">Reflection</div><h2>End each week by asking</h2><div class="q"><p><strong>What did I learn?</strong></p><p><strong>What changed my mind?</strong></p><p><strong>What would I do differently?</strong></p></div></div>'}
function dashboard(){var tasks=currentTasks(state.week),done=tasks.filter(function(t){return taskComplete(state.week+"-"+t.id,t)}).length,phase=phaseFor(state.week);var next=state.week<44?weeks[state.week][0]:"Capstone complete";return '<section class="hero"><div class="eyebrow">Personal learning + evidence studio</div><h1>Learn. Observe. Apply. Reflect.</h1><p>A focused command center for knowing what you are learning now, what you need to produce, and what practice keeps your design judgment growing.</p></section><div class="card"><div class="eyebrow">Current learning unit</div><h2>Week '+state.week+' — '+esc(weeks[state.week-1][0])+'</h2><p>'+esc(weeks[state.week-1][1])+'</p><span class="pill">Phase '+phase+' · '+esc(phaseNames[phase-1])+'</span><span class="pill">Suggested pace · ~1 week</span><div style="margin-top:14px"><button class="btn" onclick="go(\'curriculum\')">Open curriculum</button></div></div><div class="card"><div class="eyebrow">This week</div><h2>Core learning <span class="small">'+done+'/'+tasks.length+' complete</span></h2>'+tasks.map(function(t,i){var k=state.week+"-"+t.id,complete=taskComplete(k,t);return '<div class="task"><label style="display:flex;align-items:center;gap:12px;padding:15px 4px;cursor:pointer"><input class="task-check" type="checkbox" '+(state.tasks[k]?"checked":"")+' '+(complete?"":"disabled")+' onclick="event.stopPropagation();toggleTask(\''+esc(k)+'\',this.checked)"><span class="task-title">'+(i+1)+'. '+esc(t.title)+'</span><span class="task-status">'+(complete?"Complete":"In progress")+'</span></label></div>'}).join("")+'</div><div class="card"><div class="eyebrow">Weekly practice</div><h2>Keep the design muscle active</h2><p>These support the curriculum without blocking checkpoint completion.</p><button class="btn secondary" onclick="go(\'interface\')">Open Interface Practice</button><div class="small" style="margin-top:10px">Analyze → Recreate → Explain · ~30 min</div></div><div class="card"><div class="eyebrow">Checkpoint</div><h2>Finish the current learning unit</h2><p class="small">Complete the required coursework, then close out the unit. Checkpoints mark progression; weeks provide rhythm.</p><button class="btn" onclick="go(\'curriculum\')">View checkpoint work</button></div><div class="card"><div class="eyebrow">Next</div><h2>'+esc(next)+'</h2></div>'}
function curriculum(){var w=state.week,phase=phaseFor(w),tasks=currentTasks(w);var html='<div class="weeknav"><div><div class="eyebrow">Phase '+phase+' · '+esc(phaseNames[phase-1])+'</div><h1>Week '+w+' — '+esc(weeks[w-1][0])+'</h1></div><select class="weekselect" onchange="state.week=+this.value;save()">';weeks.forEach(function(x,i){html+='<option value="'+(i+1)+'" '+(i+1===w?"selected":"")+'>Week '+(i+1)+' — '+esc(x[0])+'</option>'});html+='</select></div><div class="card"><div class="eyebrow">Core question</div><h2>'+esc(weeks[w-1][1])+'</h2></div><div class="card"><h2>Studio tasks</h2><p class="small">Open each task to see what you should learn, capture, or produce. Complete the prompts first; the check appears when the task is ready to mark complete.</p>';tasks.forEach(function(t,i){html+=taskHtml(t,i,w)});html+='</div>';
if(w===1)html+=weekOneObservations();
var finished=!!state.weekCompleted[w];html+='<div class="week-complete">'+(finished?'<div><strong>Week completed</strong><div class="done-date">Completed '+weekCompletedLabel(w)+'</div></div>':'<div><strong>Ready to move on?</strong><div class="done-date">Finish the required prompts, then close out this week.</div></div>')+(finished?'':'<button class="btn" onclick="completeWeek()">Complete Week '+w+'</button>')+'</div>';
return html}
function weekOneObservations(){var html='<div class="card"><h2>Observe 10 everyday interactions</h2><p class="small">Suggested: door, faucet, stove, elevator, microwave, car interface, coffee machine, ATM, phone app, frustrating home object. No redesigning yet—the goal is to train observation.</p>';for(var i=0;i<10;i++)html+=observation(i);html+='<button class="btn" onclick="saveObs()">Save observations</button></div>';return html}
function observation(i){var o=state.observations[i]||{};function f(k,l,t){return '<div class="field"><label>'+l+'</label>'+(t?'<textarea data-i="'+i+'" data-k="'+k+'">'+esc(o[k])+"</textarea>":'<input data-i="'+i+'" data-k="'+k+'" value="'+esc(o[k])+'">')+"</div>"}return '<div class="obs"><strong>'+(i+1)+'. Observation</strong>'+f("goal","What were you trying to do?")+f("expect","What did you expect?")+f("signal","What did the design communicate?")+f("result","What happened?")+f("error","Where did you hesitate or make an error?")+f("human","What does this tell you about the human using it?",true)+'</div>'}
function saveObs(){document.querySelectorAll("[data-i]").forEach(function(el){var i=+el.dataset.i;state.observations[i]=state.observations[i]||{};state.observations[i][el.dataset.k]=el.value});save()}
function scheduleSummary(){return Object.keys(state.weekCompleted).length+" of 44 weeks completed."}
function formatDate(d){return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function weekDates(i){if(!state.startDate||!state.endDate)return null;var a=new Date(state.startDate+"T12:00:00"),b=new Date(state.endDate+"T12:00:00"),total=b-a,weekMs=total/44,start=new Date(a.getTime()+weekMs*(i-1)),end=new Date(a.getTime()+weekMs*i-86400000);return {start:start,end:end}}
function schedule(){var html='<div class="eyebrow">Curriculum planning</div><h1>Schedule</h1><p class="hero">A record of when each week was completed. Your schedule grows as you move through the curriculum.</p><div class="card"><h2>44-week curriculum</h2><table class="schedule-table"><thead><tr><th>Week</th><th>Topic</th><th>Completed</th><th>Status</th></tr></thead><tbody>';for(var i=1;i<=44;i++){var done=!!state.weekCompleted[i];html+='<tr><td><button class="btn secondary" onclick="openWeek('+i+')">Week '+i+'</button></td><td>'+esc(weeks[i-1][0])+'</td><td>'+(done?formatDate(new Date(state.weekCompleted[i])):"—")+'</td><td class="'+(done?"complete":"todo")+'">'+(done?"✓ Complete":"Not complete")+'</td></tr>'}html+='</tbody></table></div>';return html}
var weekOneTerms=[
["HCI","What is HCI actually concerned with beyond making interfaces look good? How do people, technology, and context interact?"],
["Human-centered design","What does it mean to design around people’s needs, abilities, goals, and context rather than around technology alone?"],
["Mental model","What does a person believe is happening when they use a product? Where might that expectation differ from how the system actually works?"],
["Affordance","What actions does an object or interface make possible? Which possibilities are physically or digitally supported?"],
["Signifier","What tells a person what action is possible or where/how to act? What visual, physical, or contextual cues are doing the communicating?"],
["Feedback","How does the system communicate the result of an action? What would happen if the user received no feedback?"],
["Mapping","How clearly does the relationship between a control and its effect correspond to what the person expects?"],
["Constraint","What limits the possible actions and helps prevent errors or confusion? Is the constraint physical, logical, semantic, or cultural?"],
["Discoverability","Can a person figure out what they can do without being told? What makes an action easy or difficult to discover?"],
["Error","What happened when the interaction did not go as expected? Was the error caused by the person, the design, the system, or the context?"],
["Recognition vs. recall","Does the design let people recognize useful information instead of making them remember it? Where did you see the difference?"]
];
function library(){var h="<div class=\"eyebrow\">Design vocabulary</div><h1>Learning Library</h1><p class=\"hero\">Capture HCI concepts in your own words and connect them to the curriculum.</p><div class=\"card\"><h2>Week 1 — HCI Foundations</h2>";weekOneTerms.forEach(function(x,i){var f=state.concepts.filter(function(c){return c.term===x[0]})[0]||{};h+="<div class=\"term-card\"><h3>"+esc(x[0])+"</h3><p class=\"small\">"+esc(x[1])+"</p><div class=\"field\"><label>My understanding</label><textarea id=\"cu"+i+"\">"+esc(f.understanding||"")+"</textarea></div><div class=\"field\"><label>Example / where I saw it</label><textarea id=\"ce"+i+"\">"+esc(f.example||"")+"</textarea></div><button class=\"btn secondary\" onclick=\"saveConcept("+i+")\">Save concept</button></div>"});h+="</div><div class=\"card\"><h2>Add a concept</h2><div class=\"field\"><label>Term</label><input id=\"newTerm\"></div><div class=\"field\"><label>Curriculum week</label><select id=\"newTermWeek\">";weeks.forEach(function(x,i){h+="<option value=\""+(i+1)+"\">Week "+(i+1)+" — "+esc(x[0])+"</option>"});h+="</select></div><div class=\"field\"><label>My understanding</label><textarea id=\"newUnderstanding\"></textarea></div><div class=\"field\"><label>Example / where I saw it</label><textarea id=\"newExample\"></textarea></div><button class=\"btn\" onclick=\"addConcept()\">Add concept</button></div>";return h}
function saveConcept(i){var term=weekOneTerms[i][0],f=state.concepts.filter(function(c){return c.term===term})[0];if(!f){f={term:term,week:1,understanding:"",example:""};state.concepts.push(f)}f.understanding=document.getElementById("cu"+i).value;f.example=document.getElementById("ce"+i).value;localStorage.setItem(KEY,JSON.stringify(state))}
function addConcept(){var t=document.getElementById("newTerm").value.trim();if(!t)return;state.concepts.push({term:t,week:+document.getElementById("newTermWeek").value,understanding:document.getElementById("newUnderstanding").value,example:document.getElementById("newExample").value});save()}
function books(){var html='<div class="eyebrow">Reading + annotation</div><h1>Books</h1><p class="hero">Track the books that support the curriculum. Keep notes and annotations connected to the weeks where you are using them.</p><div class="card"><h2>Your books</h2>';if(!state.books.length)state.books.push({title:"The Design of Everyday Things",author:"Don Norman",weeks:[1],notes:"",annotations:[]});state.books.forEach(function(b,bi){html+='<details class="book" '+(bi===0?"open":"")+'><summary>'+esc(b.title)+(b.author?" · "+esc(b.author):"")+'</summary><div class="linkline">Curriculum weeks: '+(b.weeks||[]).map(function(w){return '<button class="btn secondary" onclick="openWeek('+w+')">Week '+w+' — '+esc(weeks[w-1][0])+'</button>'}).join(" ")+'</div><div class="field"><label>Weeks connected</label><input value="'+esc((b.weeks||[]).join(", "))+'" onchange="updateBookWeeks('+bi+',this.value)"></div><div class="field"><label>Notes / takeaways</label><textarea onchange="updateBook('+bi+',this.value)">'+esc(b.notes||"")+'</textarea></div><h3>Annotations</h3>';(b.annotations||[]).forEach(function(a){html+='<div class="q"><strong>Week '+esc(a.week||"")+' · '+esc(weeks[(a.week||1)-1][0])+'</strong><p>'+esc(a.text||"")+'</p></div>'});html+='<div class="field"><label>Curriculum week</label><select id="annWeek'+bi+'">';weeks.forEach(function(x,i){html+='<option value="'+(i+1)+'">Week '+(i+1)+' — '+esc(x[0])+'</option>'});html+='</select><label>Annotation</label><textarea id="annText'+bi+'" placeholder="What did you notice?"></textarea></div><button class="btn secondary" onclick="addAnnotation('+bi+')">Save annotation</button></details>'});html+='</div><div class="card"><h2>Add a book</h2><div class="field"><label>Title</label><input id="bookTitle"></div><div class="field"><label>Author</label><input id="bookAuthor"></div><div class="field"><label>Curriculum week</label><select id="bookWeek">';weeks.forEach(function(x,i){html+='<option value="'+(i+1)+'">Week '+(i+1)+' — '+esc(x[0])+'</option>'});html+='</select></div><button class="btn" onclick="addBook()">Add book</button></div>';return html}
function updateBook(i,v){state.books[i].notes=v;localStorage.setItem(KEY,JSON.stringify(state))}
function updateBookWeeks(i,v){state.books[i].weeks=v.split(",").map(function(x){return +x.trim()}).filter(function(x){return x>=1&&x<=44});localStorage.setItem(KEY,JSON.stringify(state));render()}
function addAnnotation(i){var w=+document.getElementById("annWeek"+i).value,t=document.getElementById("annText"+i).value.trim();if(!t)return;state.books[i].annotations=state.books[i].annotations||[];state.books[i].annotations.push({week:w,text:t});save()}
function addBook(){var t=document.getElementById("bookTitle").value.trim();if(!t)return;state.books.push({title:t,author:document.getElementById("bookAuthor").value,weeks:[+document.getElementById("bookWeek").value],notes:"",annotations:[]});save()}
function evidence(){var html='<div class="eyebrow">Applied practice</div><h1>Work & Evidence</h1><p class="hero">Log the work that proves what you are learning: research, IA, interaction design, evaluation, product thinking, and AI+UX.</p><div class="card"><h2>Add evidence</h2><div class="field"><label>Work item</label><input id="work"></div><div class="field"><label>Project / context</label><input id="project"></div><div class="field"><label>What did you do or learn?</label><textarea id="detail"></textarea></div><button class="btn" onclick="addEvidence()">Log work</button></div>';state.evidence.forEach(function(x){html+='<div class="card"><h3>'+esc(x.work)+'</h3><div class="small">'+esc(x.project)+'</div><p>'+esc(x.detail)+'</p></div>'});return html}
function addEvidence(){state.evidence.unshift({work:document.getElementById("work").value,project:document.getElementById("project").value,detail:document.getElementById("detail").value});save()}
function syllabus(){return '<div class="eyebrow">The syllabus</div><h1>Product Design + HCI Studio</h1><p class="hero">A 9–12 month, checkpoint-based curriculum for building formal-level HCI knowledge, research capability, interaction and visual design judgment, product thinking, and technical fluency.</p><div class="grid"><div class="stat"><b>HCI</b><span>Understand people.</span></div><div class="stat"><b>Design</b><span>Turn understanding into experiences.</span></div><div class="stat"><b>Product</b><span>Make experiences useful, feasible, and valuable.</span></div></div><div class="card"><div class="eyebrow">The outcome</div><h2>What you are building toward</h2><div class="q">I can understand a problem, research it, make sense of complex information, define an experience, design and prototype a solution, evaluate it with users, work with engineers and PMs, and explain why I made the decisions I made.</div></div><div class="card"><div class="eyebrow">Learning model</div><h2>Learn → Capture → Observe → Apply → Critique → Reflect → Evidence</h2><p>Learning units are the coursework. Checkpoints determine progression. Weekly check-ins create rhythm. Evidence is the proof of applied learning.</p><div class="muted-box"><strong>Suggested pace:</strong> ~5–7 hours/week. The 44-week timeline is a pacing estimate, not a rigid deadline.</div></div><div class="card"><div class="eyebrow">The journey</div>'+phaseNames.map(function(n,i){return '<div class="phase-row"><div class="phase-num">'+(i+1)+'</div><div><h3>'+esc(n)+'</h3><div class="small">'+esc(['Learn to see human behavior before trying to design solutions.','Learn to investigate problems rather than assume them.','Learn to organize complexity around human needs.','Turn understanding and structure into usable behavior.','Move from designing experiences to making product decisions.','Synthesize the entire process into substantial portfolio work.'][i])+'</div></div></div>'}).join("")+'</div><div class="card"><div class="eyebrow">Parallel practice</div><h2>What runs alongside the curriculum</h2><ul><li>Interface Practice — Analyze → Recreate → Explain</li><li>Design School Library — a living reference of concepts and reasoning</li><li>Accessibility — part of every design phase</li><li>AI + UX — a longitudinal thread through the studio</li></ul></div><div class="card"><div class="eyebrow">Graduation</div><h2>Leave with a body of evidence</h2><p>Observation, research, IA, interaction design, evaluation, product decisions, and a substantial capstone case study.</p></div>'}
function interface(){return '<div class="eyebrow">Weekly design judgment</div><h1>Interface Practice</h1><p class="hero">Analyze → Recreate → Explain. Study one excellent interface closely for about 30 minutes, then recreate a small portion.</p><div class="card"><h2>Practice log</h2><div class="field"><label>Product / interface</label><input id="ipProduct"></div><div class="field"><label>What I analyzed</label><textarea id="ipAnalyze"></textarea></div><div class="grid"><div class="field"><label>Typography</label><textarea id="ipType"></textarea></div><div class="field"><label>Spacing / hierarchy</label><textarea id="ipSpace"></textarea></div><div class="field"><label>Color</label><textarea id="ipColor"></textarea></div><div class="field"><label>Interaction</label><textarea id="ipInteraction"></textarea></div><div class="field"><label>Density / components</label><textarea id="ipDensity"></textarea></div><div class="field"><label>Responsive behavior</label><textarea id="ipResponsive"></textarea></div></div><div class="field"><label>What I recreated</label><textarea id="ipRecreated"></textarea></div><div class="field"><label>What I learned</label><textarea id="ipLearned"></textarea></div><button class="btn" onclick="addInterfacePractice()">Save practice</button></div><div class="card"><h2>Practice history</h2>'+(state.interfaceLogs||[]).map(function(x){return '<div class="term-card"><h3>'+esc(x.product)+'</h3><div class="small">'+esc(x.date||"")+'</div><p>'+esc(x.learned||"")+'</p></div>'}).join("")+'</div>'}
function addInterfacePractice(){state.interfaceLogs=state.interfaceLogs||[];state.interfaceLogs.unshift({product:document.getElementById("ipProduct").value,analyze:document.getElementById("ipAnalyze").value,type:document.getElementById("ipType").value,space:document.getElementById("ipSpace").value,color:document.getElementById("ipColor").value,interaction:document.getElementById("ipInteraction").value,density:document.getElementById("ipDensity").value,responsive:document.getElementById("ipResponsive").value,recreated:document.getElementById("ipRecreated").value,learned:document.getElementById("ipLearned").value,date:formatDate(new Date())});save()}
function render(){var views={dashboard:dashboard,syllabus:syllabus,curriculum:curriculum,library:library,interface:interface,books:books};document.getElementById("app").innerHTML=views[page]()}
try{nav();render();updateTimer()}catch(e){document.getElementById("app").innerHTML='<div class="card"><h1>Studio could not load</h1><p>There was a browser-side error while loading the studio. Your saved data has not been intentionally deleted.</p><p class="small">Try a hard refresh. If this message remains, the error can be diagnosed from the browser console.</p></div>';console.error(e)}
</script></body></html>
