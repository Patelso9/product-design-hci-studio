<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Design + HCI Studio</title>
<style>
:root{--ink:#23352e;--muted:#718078;--paper:#f7f3ea;--panel:#fffdf8;--line:#ded8ca;--green:#183f34;--gold:#a8874d;--sage:#dce5dc;--soft:#f1eadb}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,sans-serif}.shell{display:flex;min-height:100vh}.side{width:245px;background:var(--green);color:#fff;padding:30px 20px;position:fixed;inset:0 auto 0 0}.brand{font:25px Georgia,serif}.sub{font-size:12px;color:#c7d4ce}.nav{margin-top:40px;display:grid;gap:6px}.nav button{background:none;border:0;color:#dbe5df;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#285546;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:42px clamp(25px,5vw,75px);max-width:1250px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--gold);font-weight:700}.hero h1,h1,h2,h3{font-family:Georgia,serif;font-weight:400}.hero h1{font-size:44px;line-height:1.08;margin:8px 0 14px}.hero p{max-width:720px;color:var(--muted);font-size:17px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}.stat b{display:block;font:30px Georgia,serif}.stat span,.small{color:var(--muted);font-size:12px}.card{margin:16px 0}.card h2{margin:0 0 10px;font-size:24px}.card h3{margin:0 0 6px;font-size:18px}.pill{display:inline-block;background:var(--sage);padding:4px 9px;border-radius:99px;font-size:12px;margin:3px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.q{background:var(--soft);border-left:3px solid var(--gold);padding:14px 16px;margin:14px 0}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}input,textarea,select{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);font:inherit}textarea{min-height:110px;resize:vertical}.btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:8px;padding:9px 14px;cursor:pointer}.btn.secondary{background:transparent;color:var(--green)}.btn:disabled{opacity:.45;cursor:not-allowed}.weeknav{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:18px}.weeknav h1{margin:7px 0}.weekselect{width:auto;min-width:190px}.task{border-top:1px solid var(--line)}.task:first-child{border-top:0}.task summary{list-style:none;cursor:pointer;padding:16px 4px;display:flex;align-items:center;gap:12px}.task summary::-webkit-details-marker{display:none}.task summary:before{content:'＋';font-size:18px;color:var(--gold);width:18px}.task[open] summary:before{content:'−'}.task-title{flex:1;font-family:Georgia,serif;font-size:18px}.task-check{width:20px;height:20px;accent-color:var(--green);margin:0}.task-body{padding:0 36px 18px}.task-body .q{margin-top:0}.task.done .task-title{text-decoration:line-through;color:var(--muted)}.task-status{font-size:11px;color:var(--muted);margin-left:auto}.obs{border-top:1px solid var(--line);padding:18px 0}.obs:first-of-type{border-top:0}.obs strong{font:18px Georgia,serif}.term-card{border-top:1px solid var(--line);padding:18px 0}.term-card:first-of-type{border-top:0}.term-card h3{margin:0}.schedule-table{width:100%;border-collapse:collapse}.schedule-table th,.schedule-table td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}.schedule-table th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.complete{color:var(--green);font-weight:700}.todo{color:var(--muted)}.date-input{max-width:190px}.progress{height:6px;background:#e5dfd3;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}@media(max-width:800px){.side{position:static;width:100%;height:auto}.shell{display:block}.main{margin:0;width:100%;padding:28px 18px}.nav{display:flex;overflow:auto;margin-top:20px}.nav button{white-space:nowrap}.grid{grid-template-columns:1fr}.hero h1{font-size:36px}.weeknav{align-items:flex-start;flex-direction:column}.weekselect{width:100%}.schedule-table{font-size:13px}.schedule-table th:nth-child(4),.schedule-table td:nth-child(4){display:none}}
</style></head><body>
<div class="shell"><aside class="side"><div class="brand">HCI Studio</div><div class="sub">Product Design + HCI</div><nav class="nav" id="nav"></nav></aside><main class="main" id="app"></main></div>
<script>
var KEY="pdHciStudio";
var weeks=[
["HCI Foundations","How do people actually interact with the world around them, and what can designers learn from observing that interaction?"],
["Human Behavior & Limitations","How do attention, memory, perception, and motivation shape interaction?"],
["Mental Models","How do expectations form, and where do product models diverge from user models?"],
["Design Principles","How do affordances, signifiers, feedback, mapping, and constraints communicate action?"],
["HCI Synthesis","What patterns are you now able to see that you previously overlooked?"]
];
for(var wi=6;wi<=44;wi++)weeks.push(["Studio Week "+wi,"Continue building HCI, UX research, IA, interaction design, evaluation, and product thinking through applied practice."]);

var phaseNames=["HCI + Human Behavior","UX Research","Information Architecture","Interaction Design","Product Design + Evaluation","Capstone + Portfolio"];
var weekTasks={
1:[
{id:"read",title:"Read + actively annotate",prompt:"Read The Design of Everyday Things. Capture 3 moments where Norman describes a mismatch between what a person expects and what a product actually allows.",fields:[["moments","Your 3 moments","textarea"]]},
{id:"observe",title:"Observe 10 everyday interactions",prompt:"Observe before redesigning. For each object or experience, record what you were trying to do, what you expected, what the design communicated, what happened, where you hesitated or erred, and what this reveals about the human using it.",fields:[["observationSummary","What patterns did you notice across the 10 observations?","textarea"]]},
{id:"vocabulary",title:"Build your HCI vocabulary",prompt:"Work through the Week 1 terms in the Learning Library. For each, write your own understanding and connect it to something you observed.",fields:[["vocabularyNotes","Which concepts became clearer through observation? Give at least 3 examples.","textarea"]]},
{id:"apply",title:"Connect observation to HCI",prompt:"Choose one observation and explain what it reveals about the relationship between people, technology, and context.",fields:[["analysis","Your analysis","textarea"]]},
{id:"reflect",title:"Reflect",prompt:"Write: What did I notice this week that I would not have noticed before studying HCI?",fields:[["reflection","Your reflection","textarea"]]}
]};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
var DEFAULT_STATE={week:1,tasks:{},taskData:{},concepts:[],observations:[],reflection:"",notes:"",evidence:[],startDate:"",endDate:""};
var state;
try{state=JSON.parse(localStorage.getItem(KEY)||"null")||DEFAULT_STATE}catch(e){state=DEFAULT_STATE;try{localStorage.removeItem(KEY)}catch(ignore){}}
state.taskData=state.taskData||{};state.concepts=state.concepts||[];state.observations=state.observations||[];state.evidence=state.evidence||[];
var page="dashboard";
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function go(p){page=p;nav();render()}
function nav(){var items=[["dashboard","Dashboard"],["curriculum","Curriculum"],["schedule","Schedule"],["library","Learning Library"],["evidence","Work & Evidence"]];document.getElementById("nav").innerHTML=items.map(function(x){return '<button class="'+(page===x[0]?"active":"")+'" onclick="go(\''+x[0]+'\')">'+x[1]+"</button>"}).join("")}
function phaseFor(w){return w<=5?1:w<=13?2:w<=19?3:w<=27?4:w<=34?5:6}
function currentTasks(w){if(weekTasks[w])return weekTasks[w];return[
{id:"learn",title:"Learn the core material",prompt:"Complete the assigned learning for this week. Capture the ideas, examples, and questions that matter.",fields:[["learningNotes","What did you learn?","textarea"]]},
{id:"apply",title:"Apply it to a real product",prompt:"Use this week’s concept to analyze a real product or experience.",fields:[["application","What did you observe or apply?","textarea"]]},
{id:"capture",title:"Capture observations",prompt:"Record 3 useful observations, examples, or questions from your work.",fields:[["observations","Your 3 observations, examples, or questions","textarea"]]},
{id:"concept",title:"Add to your vocabulary",prompt:"Add at least one useful concept to the Learning Library and explain it in your own words.",fields:[["conceptNotes","What concept did you capture and why does it matter?","textarea"]]},
{id:"reflect",title:"Reflect",prompt:"What changed in your thinking this week?",fields:[["reflection","Your reflection","textarea"]]}
]}
function taskComplete(k,t){if(state.tasks[k])return true;var d=state.taskData[k]||{};return t.fields.every(function(f){return String(d[f[0]]||"").trim().length>0})}
function taskHtml(t,index,w){var k=w+"-"+t.id,d=state.taskData[k]||{},complete=taskComplete(k,t);var fields=t.fields.map(function(f){var tag=f[2]==="textarea"?'<textarea data-task="'+esc(k)+'" data-field="'+esc(f[0])+'" oninput="saveTaskField(this)">'+esc(d[f[0]])+"</textarea>":'<input data-task="'+esc(k)+'" data-field="'+esc(f[0])+'" value="'+esc(d[f[0]])+'" oninput="saveTaskField(this)">';return '<div class="field"><label>'+esc(f[1])+'</label>'+tag+"</div>"}).join("");return '<details class="task" '+(complete?"":"open")+'><summary><span class="task-title">"+(index+1)+". "+esc(t.title)+'</span><span class="task-status">'+(complete?"Complete":"In progress")+'</span><input class="task-check" type="checkbox" '+(state.tasks[k]?"checked":"")+' '+(complete?"":"disabled")+' onclick="event.stopPropagation();toggleTask(\''+esc(k)+'\',this.checked)"></summary><div class="task-body"><div class="q">'+esc(t.prompt)+'</div>'+fields+'</div></details>'}
function saveTaskField(el){var k=el.dataset.task;state.taskData[k]=state.taskData[k]||{};state.taskData[k][el.dataset.field]=el.value;localStorage.setItem(KEY,JSON.stringify(state));var t=currentTasks(state.week).filter(function(x){return state.week+"-"+x.id===k})[0];if(t){var status=taskComplete(k,t);var root=el.closest(".task");var s=root.querySelector(".task-status");if(s)s.textContent=status?"Complete":"In progress";var c=root.querySelector(".task-check");if(c)c.disabled=!status}}
function toggleTask(k,val){state.tasks[k]=val;save()}
function dashboard(){var tasks=currentTasks(state.week),done=tasks.filter(function(t){return taskComplete(state.week+"-"+t.id,t)}).length;return '<section class="hero"><div class="eyebrow">Personal learning + evidence system</div><h1>Learn. Observe. Apply. Reflect.</h1><p>A studio for building real HCI and Product Design depth—not just checking off a course.</p></section><div class="grid"><div class="stat"><b>Week '+state.week+'</b><span>'+esc(weeks[state.week-1][0])+'</span></div><div class="stat"><b>'+done+'/'+tasks.length+'</b><span>Current week tasks complete</span></div><div class="stat"><b>'+state.concepts.length+'</b><span>Concepts captured</span></div></div><div class="card"><h2>This week</h2><h3>Week '+state.week+' — '+esc(weeks[state.week-1][0])+'</h3><p>'+esc(weeks[state.week-1][1])+'</p><button class="btn" onclick="go(\'curriculum\')">Open week</button></div><div class="card"><h2>Schedule</h2><p class="small">'+scheduleSummary()+'</p><button class="btn secondary" onclick="go(\'schedule\')">View full schedule</button></div>'}
function curriculum(){var w=state.week,phase=phaseFor(w),tasks=currentTasks(w);var html='<div class="weeknav"><div><div class="eyebrow">Phase '+phase+' · '+esc(phaseNames[phase-1])+'</div><h1>Week '+w+' — '+esc(weeks[w-1][0])+'</h1></div><select class="weekselect" onchange="state.week=+this.value;save()">';weeks.forEach(function(x,i){html+='<option value="'+(i+1)+'" '+(i+1===w?"selected":"")+'>Week '+(i+1)+' — '+esc(x[0])+'</option>'});html+='</select></div><div class="card"><div class="eyebrow">Core question</div><h2>'+esc(weeks[w-1][1])+'</h2></div><div class="card"><h2>Studio tasks</h2><p class="small">Open each task to see what you should learn, capture, or produce. Complete the prompts first; the check appears when the task is ready to mark complete.</p>';tasks.forEach(function(t,i){html+=taskHtml(t,i,w)});html+='</div>';
if(w===1)html+=weekOneObservations();
return html}
function weekOneObservations(){var html='<div class="card"><h2>Observe 10 everyday interactions</h2><p class="small">Suggested: door, faucet, stove, elevator, microwave, car interface, coffee machine, ATM, phone app, frustrating home object. No redesigning yet—the goal is to train observation.</p>';for(var i=0;i<10;i++)html+=observation(i);html+='<button class="btn" onclick="saveObs()">Save observations</button></div>';return html}
function observation(i){var o=state.observations[i]||{};function f(k,l,t){return '<div class="field"><label>'+l+'</label>'+(t?'<textarea data-i="'+i+'" data-k="'+k+'">'+esc(o[k])+"</textarea>":'<input data-i="'+i+'" data-k="'+k+'" value="'+esc(o[k])+'">')+"</div>"}return '<div class="obs"><strong>'+(i+1)+'. Observation</strong>'+f("goal","What were you trying to do?")+f("expect","What did you expect?")+f("signal","What did the design communicate?")+f("result","What happened?")+f("error","Where did you hesitate or make an error?")+f("human","What does this tell you about the human using it?",true)+'</div>'}
function saveObs(){document.querySelectorAll("[data-i]").forEach(function(el){var i=+el.dataset.i;state.observations[i]=state.observations[i]||{};state.observations[i][el.dataset.k]=el.value});save()}
function scheduleSummary(){if(!state.startDate||!state.endDate)return"Set your start and end dates to map the 44-week curriculum.";return esc(formatDate(new Date(state.startDate+"T12:00:00")))+" → "+esc(formatDate(new Date(state.endDate+"T12:00:00")))}
function formatDate(d){return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function weekDates(i){if(!state.startDate||!state.endDate)return null;var a=new Date(state.startDate+"T12:00:00"),b=new Date(state.endDate+"T12:00:00"),total=b-a,weekMs=total/44,start=new Date(a.getTime()+weekMs*(i-1)),end=new Date(a.getTime()+weekMs*i-86400000);return {start:start,end:end}}
function schedule(){var html='<div class="eyebrow">Curriculum planning</div><h1>Schedule</h1><p class="hero">Set the overall learning window and see how the 44-week studio maps across your calendar.</p><div class="card"><h2>Studio dates</h2><div class="row"><div class="field" style="flex:1"><label>Start date</label><input class="date-input" type="date" value="'+esc(state.startDate)+'" onchange="state.startDate=this.value;save()"></div><div class="field" style="flex:1"><label>Target end date</label><input class="date-input" type="date" value="'+esc(state.endDate)+'" onchange="state.endDate=this.value;save()"></div></div><p class="small">The schedule divides the selected window across 44 weeks. You can change these dates anytime without changing your learning notes.</p></div><div class="card"><h2>44-week curriculum</h2><table class="schedule-table"><thead><tr><th>Week</th><th>Topic</th><th>Dates</th><th>Status</th></tr></thead><tbody>';for(var i=1;i<=44;i++){var ts=currentTasks(i),complete=ts.length&&ts.every(function(t){return taskComplete(i+"-"+t.id,t)}),wd=weekDates(i);html+='<tr><td><button class="btn secondary" onclick="state.week='+i+';go(\'curriculum\')">Week '+i+"</button></td><td>"+esc(weeks[i-1][0])+"</td><td>"+(wd?formatDate(wd.start)+" – "+formatDate(wd.end):"Set dates above")+'</td><td class="'+(complete?"complete":"todo")+'">'+(complete?"✓ Complete":"Not complete")+"</td></tr>"}html+='</tbody></table></div>';return html}
var weekOneTerms=[
["HCI","What is HCI actually concerned with beyond making interfaces look good? How do people, technology, and context interact?"],
["Human-centered design","What does it mean to design around people’s needs, abilities, goals, and context rather than around technology alone?"],
["Mental model","What does a person believe is happening when they use a product? Where might that expectation differ from how the system actually works?"],
["Affordance","What actions does an object or interface make possible? Which possibilities are physically or digitally supported?"],
["Signifier","What tells a person what action is possible or where/how to act? What visual, physical, or contextual cues are doing the communicating?"],
["Feedback","How does the system communicate the result of an action? What would happen if the user received no feedback?"],
["Mapping","How clearly does the relationship between a control and its effect correspond to what the person expects?"],
["Constraint","What limits the possible actions and helps prevent errors or confusion? Is the constraint physical, logical, semantic, or cultural?"],
["Discoverability","Can a person figure out what they can do without being told? What makes an action easy or difficult to discover?"],
["Error","What happened when the interaction did not go as expected? Was the error caused by the person, the design, the system, or the context?"],
["Recognition vs. recall","Does the design let people recognize useful information instead of making them remember it? Where did you see the difference?"]
];
function library(){var html='<div class="eyebrow">Design vocabulary</div><h1>Learning Library</h1><p class="hero">The concepts you are expected to understand, plus your own working definitions and examples.</p><div class="card"><h2>Week 1 · HCI Foundations</h2><p class="small">Use these questions while learning. You do not need textbook-perfect definitions—the goal is to explain each idea in your own words and connect it to an observation.</p>';weekOneTerms.forEach(function(t){var c=state.concepts.filter(function(x){return x.term.toLowerCase()===t[0].toLowerCase()})[0];html+='<div class="term-card"><div class="row"><span class="pill">'+esc(t[0])+'</span>'+(c?'<span class="small">Captured</span>':'')+'</div><h3>'+esc(t[0])+'</h3><div class="q">'+esc(t[1])+'</div><div class="field"><label>My understanding</label><textarea data-term="'+esc(t[0])+'" data-part="def">'+esc(c?c.def:"")+'</textarea></div><div class="field"><label>Example / where I saw it</label><textarea data-term="'+esc(t[0])+'" data-part="ex">'+esc(c?c.ex:"")+'</textarea></div><button class="btn secondary" onclick="saveTerm(\''+esc(t[0])+'\')">Save term</button></div>'});html+='</div><div class="card"><h2>Additional concepts</h2><p class="small">Add concepts you encounter beyond the required weekly vocabulary.</p><div class="field"><label>Term</label><input id="term"></div><div class="field"><label>Definition / my understanding</label><textarea id="def"></textarea></div><div class="field"><label>Example / where I saw it</label><textarea id="ex"></textarea></div><button class="btn" onclick="addConcept()">Add concept</button></div>';return html}
function saveTerm(term){var def=document.querySelector('[data-term="'+CSS.escape(term)+'"][data-part="def"]').value;var ex=document.querySelector('[data-term="'+CSS.escape(term)+'"][data-part="ex"]').value;var c=state.concepts.filter(function(x){return x.term.toLowerCase()===term.toLowerCase()})[0];if(!c){c={term:term,def:"",ex:""};state.concepts.push(c)}c.def=def;c.ex=ex;save()}
function addConcept(){var t=document.getElementById("term").value.trim();if(!t)return;state.concepts.unshift({term:t,def:document.getElementById("def").value,ex:document.getElementById("ex").value});save()}
function evidence(){var html='<div class="eyebrow">Applied practice</div><h1>Work & Evidence</h1><p class="hero">Log the work that proves what you are learning: research, IA, interaction design, evaluation, product thinking, and AI+UX.</p><div class="card"><h2>Add evidence</h2><div class="field"><label>Work item</label><input id="work"></div><div class="field"><label>Project / context</label><input id="project"></div><div class="field"><label>What did you do or learn?</label><textarea id="detail"></textarea></div><button class="btn" onclick="addEvidence()">Log work</button></div>';state.evidence.forEach(function(x){html+='<div class="card"><h3>'+esc(x.work)+'</h3><div class="small">'+esc(x.project)+'</div><p>'+esc(x.detail)+'</p></div>'});return html}
function addEvidence(){state.evidence.unshift({work:document.getElementById("work").value,project:document.getElementById("project").value,detail:document.getElementById("detail").value});save()}
function render(){var views={dashboard:dashboard,curriculum:curriculum,schedule:schedule,library:library,evidence:evidence};document.getElementById("app").innerHTML=views[page]()}
try{nav();render()}catch(e){document.getElementById("app").innerHTML='<div class="card"><h1>Studio could not load</h1><p>There was a browser-side error while loading the studio. Your saved data has not been intentionally deleted.</p><p class="small">Try a hard refresh. If this message remains, the error can be diagnosed from the browser console.</p></div>';console.error(e)}
</script></body></html>
